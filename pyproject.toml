# Python for scripts/. uv owns the interpreter (.python-version), these pins,
# and their hashes (uv.lock). Every Python command runs through `uv run`.
[project]
name = "rscrypto-scripts"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
# `just update` and the tests of the catalog and workflows.
tooling = ["PyYAML==6.0.3", "tomlkit==0.15.1"]

[tool.uv]
package = false
default-groups = []
# Every pin has a wheel. No package builds from source.
no-build = true
