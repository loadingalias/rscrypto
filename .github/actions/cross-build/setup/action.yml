name: Prepare cross-build tooling
description: Install the target's shared build prerequisites.
inputs:
  target:
    description: Destination Rust target selected by the calling workflow.
    required: true
runs:
  using: composite
  steps:
    - name: Install cross-build tooling
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        scripts/tooling/x86_64-linux.sh --ci-cross-build "$TARGET"
        printf '%s\n' "$HOME/.cargo/bin" >>"$GITHUB_PATH"
