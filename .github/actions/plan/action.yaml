name: Restore Cargo Rail plan
description: Restore and verify one Linux x86-64 plan artifact before execution.

inputs:
  artifact:
    description: Saved plan artifact name.
    required: true
  identity:
    description: Expected Cargo Rail plan identity.
    required: true
  head-commit:
    description: Expected checkout commit.
    required: true

runs:
  using: composite
  steps:
    - name: Download saved plan
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/rscrypto-cargo-rail-plan

    - name: Activate saved plan
      shell: bash
      env:
        HEAD_COMMIT: ${{ inputs.head-commit }}
        PLAN_IDENTITY: ${{ inputs.identity }}
        PLAN_ROOT: ${{ runner.temp }}/rscrypto-cargo-rail-plan
      run: scripts/ci/activate-plan.sh "$PLAN_ROOT" "$PLAN_IDENTITY" "$HEAD_COMMIT"
