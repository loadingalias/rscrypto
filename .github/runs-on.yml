# AWS runner profiles. Keep sizing here; workflows select names without shape overrides.
# Public repositories resolve this catalog from the default branch.
# dev-machines bakes these from scripts/tooling for the operations in .config/images.toml;
# `dev-machine image-refresh rscrypto` rebuilds stale ones. Rebuild within 25 days:
# GitHub rejects runner agents older than 30 days.
images:
  rscrypto-ci-linux-x64:
    platform: linux
    arch: x64
    ami: ami-00b15a07b6983ecff
  rscrypto-ci-linux-arm64:
    platform: linux
    arch: arm64
    ami: ami-0fde116a6470b6bbd
  rscrypto-ci-windows-x64:
    platform: windows
    arch: x64
    ami: ami-03d64564ec4b4e7fa
runners:
  plan:
    family: [c7a.large, c7i.large, c8a.large, c8i.large]
    cpu: 2
    image: ubuntu24-minimal-x64
    spot: price-capacity-optimized
    volume: 40gb:gp3
  miri:
    family: [c7a.large, c8a.large]
    cpu: 2
    image: rscrypto-ci-linux-x64
    spot: price-capacity-optimized
    volume: 150gb:gp3
  package:
    family: [c7a.xlarge, c7i.xlarge, c8a.xlarge, c8i.xlarge]
    cpu: 4
    image: rscrypto-ci-linux-x64
    spot: price-capacity-optimized
    volume: 100gb:gp3
  compatibility:
    family: [c7a.2xlarge, c7i.2xlarge, c8a.2xlarge, c8i.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-x64
    spot: price-capacity-optimized
    volume: 150gb:gp3
  # On-Demand: the RISC-V, POWER and IBM Z rows wait on these ~20-minute builds, and
  # spot reclaims (BidEvictedEvent) cancelled them twice in CI 38298834264.
  ci-cross-build:
    family: [c7a.4xlarge, c7i.4xlarge, c8a.4xlarge, c8i.4xlarge]
    cpu: 16
    image: rscrypto-ci-linux-x64
    spot: false
    volume: 150gb:gp3
  ct-cross-build:
    family: [c7a.2xlarge, c7i.2xlarge, c8a.2xlarge, c8i.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-x64
    spot: price-capacity-optimized
    volume: 150gb:gp3
  # The bench profile links each target with one codegen unit and fat LTO, so more cores add little.
  # Bench starts one per cross target and primitive family at once;
  # scripts/test/cross_workflow_test.py checks that total against the Spot vCPU quota.
  bench-cross-build:
    family: [c7a.4xlarge, c7i.4xlarge, c8a.4xlarge, c8i.4xlarge]
    cpu: 16
    image: rscrypto-ci-linux-x64
    spot: price-capacity-optimized
    volume: 150gb:gp3
  # On-Demand: a spot reclaim (BidEvictedEvent 22:49:45Z) cancelled this native row of
  # CI 38315203643 after its test suites had passed.
  x86_64-linux:
    family: [c7a.4xlarge, c7i.4xlarge, c8a.4xlarge, c8i.4xlarge]
    cpu: 16
    image: rscrypto-ci-linux-x64
    spot: false
    volume: 150gb:gp3
  # On-Demand: a spot reclaim (BidEvictedEvent 01:09:38Z) cancelled this native row of
  # CI 38326665335 during its test suites.
  aarch64-linux:
    family: [c7g.4xlarge, c8g.4xlarge, c9g.4xlarge]
    cpu: 16
    image: rscrypto-ci-linux-arm64
    spot: false
    volume: 150gb:gp3
  # On-Demand: a spot reclaim (BidEvictedEvent 19:51:07Z) failed this row of
  # CI 38453428973 during its tests.
  x86_64-win:
    family: [c7a.2xlarge, c8a.2xlarge]
    cpu: 8
    image: rscrypto-ci-windows-x64
    spot: false
    volume: 200gb:gp3
  # Eight concurrent fuzz targets need eight physical cores, including on x86.
  fuzz-x86_64-linux:
    family: [c7a.2xlarge, c8a.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-x64
    spot: price-capacity-optimized
    volume: 150gb:gp3
  fuzz-aarch64-linux:
    family: [c7g.2xlarge, c8g.2xlarge, c9g.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-arm64
    spot: price-capacity-optimized
    volume: 150gb:gp3
  # Fixed, non-Flex, On-Demand CT hardware; sized independently of benchmarks.
  ct-x86_64-linux-intel:
    family: [c8i.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-x64
    spot: false
    volume: 100gb:gp3
  ct-x86_64-win-intel:
    family: [c8i.xlarge]
    cpu: 4
    image: rscrypto-ci-windows-x64
    spot: false
    volume: 150gb:gp3
  ct-aarch64-linux:
    family: [c9g.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-arm64
    spot: false
    volume: 100gb:gp3
  # Fixed benchmark hardware preserves the existing measurement baseline.
  measure-x86_64-linux-intel:
    family: [c8i.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-x64
    spot: false
    volume: 100gb:gp3
  measure-x86_64-linux-amd:
    family: [c8a.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-x64
    spot: false
    volume: 100gb:gp3
  measure-x86_64-win-intel:
    family: [c8i.2xlarge]
    cpu: 8
    image: rscrypto-ci-windows-x64
    spot: false
    volume: 150gb:gp3
  measure-x86_64-win-amd:
    family: [c8a.2xlarge]
    cpu: 8
    image: rscrypto-ci-windows-x64
    spot: false
    volume: 150gb:gp3
  measure-aarch64-linux:
    family: [c9g.2xlarge]
    cpu: 8
    image: rscrypto-ci-linux-arm64
    spot: false
    volume: 100gb:gp3
