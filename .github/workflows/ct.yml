name: Constant-Time
run-name: Constant-Time

on:
  workflow_call:
    inputs:
      architectures:
        description: Native architectures to qualify; release callers should use all
        type: string
        default: all
  workflow_dispatch:
    inputs:
      diagnostic_case:
        description: Exact CT case, comma-separated cases, mldsa for all required ML-DSA kernel cases, or mldsa-probe for the ML-DSA diagnostic probes, on Linux platforms; scoped evidence only
        type: string
        default: ""
      architectures:
        description: all, or comma-separated x86_64-linux,aarch64-linux,x86_64-win,s390x-linux,powerpc64le-linux,riscv64-linux
        type: string
        required: true
        default: all

permissions:
  contents: read

env:
  CARGO_RAIL_CACHE: "off"
  INPUT_ARCHITECTURES: ${{ inputs.architectures || 'all' }}
  DIAGNOSTIC_CASE: ${{ inputs.diagnostic_case || '' }}

defaults:
  run:
    shell: bash

jobs:
  select:
    runs-on: runs-on=${{ github.run_id }}/runner=plan/env=production
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      cross: ${{ steps.select.outputs.cross }}
      builds: ${{ steps.select.outputs.builds }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - id: select
        run: python3 scripts/ct/ci.py plan

  cross-build:
    needs: select
    if: needs.select.outputs.cross == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.target }}/runner=ct-cross-build/env=production
    timeout-minutes: 45
    name: Prepare ${{ matrix.target }} CT
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.builds) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-build tooling
        uses: ./.github/actions/cross-build/setup
        with:
          target: ${{ matrix.target }}
      - name: Prepare and validate exact target CT binaries
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-transfer
          just ct-full --target "$TARGET" --prepare-archive "target/$TARGET-ct.tar.gz"
      - uses: ./.github/actions/cross-build/upload
        with:
          target: ${{ matrix.target }}
          suite: ct

  ct:
    needs: [select, cross-build]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.cross-build.result == 'success' || needs.cross-build.result == 'skipped') }}
    name: ${{ matrix.platform }} (${{ inputs.diagnostic_case && 'diagnostic' || 'full' }})
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Restore verified Ubuntu package state
        id: apt-state
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-state
        with:
          id: ${{ matrix.target && format('cross-run-{0}', matrix.platform) || format('ct-full-{0}', matrix.platform) }}
      - name: Install tooling and run CT (Linux)
        if: runner.os == 'Linux' && !matrix.target
        env:
          DIAGNOSTIC_CASES: ${{ matrix.diagnostic_cases }}
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-ct-full
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          if [[ -n "$DIAGNOSTIC_CASES" ]]; then
            read -ra cases <<< "$DIAGNOSTIC_CASES"
            just ct-full "${cases[@]/#/--dudect-case=}"
          else
            if [[ "$PLATFORM" == x86_64-linux ]]; then just ct-test; fi
            just ct-full
          fi
      - name: Download prepared target CT evidence from this workflow run
        if: matrix.target
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: ${{ matrix.target }}-ct-prepared
          path: target/cross-download
      - name: Measure the prepared binaries on native hardware
        if: matrix.target
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-cross-run "target/cross-download/${{ matrix.target }}-tools.tar.gz"
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          if [[ -n "$DIAGNOSTIC_CASE" ]]; then
            just ct-replay --target "${{ matrix.target }}" --source-root . --archive "target/cross-download/${{ matrix.target }}-ct.tar.gz" --out target/ct/diagnostic --case="$DIAGNOSTIC_CASE" --repetitions 1
          else
            just ct-full --target "${{ matrix.target }}" --run-archive "target/cross-download/${{ matrix.target }}-ct.tar.gz"
          fi
      - name: Install tooling and run CT (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/tooling/x86_64-win.ps1 -CiCt
          just ct-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package CT evidence
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          if [[ -d target/ct ]]; then
            tar -czf "target/ct-${PLATFORM}-full.tar.gz" -C target ct
          fi
      # Windows resolves a bare `bash` to the WSL launcher; use the bundled tar.
      - name: Package CT evidence (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          if (Test-Path target/ct) {
            tar -czf "target/ct-$env:PLATFORM-full.tar.gz" -C target ct
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Retain CT evidence
        if: ${{ !cancelled() }}
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: ct-${{ matrix.platform }}-full
          path: target/ct-${{ matrix.platform }}-full.tar.gz
          if-no-files-found: warn
          retention-days: 7
      - name: Save verified Ubuntu package state
        if: always() && steps.apt-state.outputs.key
        uses: ./.github/actions/apt-state/save
        with:
          key: ${{ steps.apt-state.outputs.key }}
          hit: ${{ steps.apt-state.outputs.hit }}
