name: CT smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_RAIL_CACHE: "off"

concurrency:
  group: ct-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ct:
    runs-on: runs-on=${{ github.run_id }}/family=c7a+c7i+c8a+c8i+m7a+m7i+m8a+m8i/cpu=8/ram=16+32/image=ubuntu24-minimal-x64/spot=price-capacity-optimized/volume=150gb:gp3/env=production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install tooling and check CT artifacts and timing smoke
        run: |
          scripts/tooling/x86_64-linux.sh --ci-ct
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just ct-test
          just ct-artifacts
          just ct-validate
          just ct-dudect --smoke
          just ct-validate --manifest-only --strict-coverage
      - name: Retain CT evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ct-x86_64-linux
          path: |
            target/ct/
          if-no-files-found: warn
          retention-days: 7
