name: Constant-Time
run-name: Constant-Time

on:
  workflow_call:
    inputs:
      architectures:
        description: Native architectures to qualify; release callers should use all
        type: string
        default: all
      require_riscv:
        description: Wait for a RISC-V runner instead of skipping RISC-V after 30 queued minutes
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      diagnostic_case:
        description: Exact CT case, comma-separated cases, mldsa for all required ML-DSA kernel cases, or mldsa-probe for the ML-DSA diagnostic probes, on Linux platforms; scoped evidence only
        type: string
        default: ""
      architectures:
        description: all, or comma-separated x86_64-linux,aarch64-linux,x86_64-win,s390x-linux,powerpc64le-linux,riscv64-linux
        type: string
        required: true
        default: all
      require_riscv:
        description: Wait for a RISC-V runner instead of skipping RISC-V after 30 queued minutes
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_RAIL_CACHE: "off"
  INPUT_ARCHITECTURES: ${{ inputs.architectures || 'all' }}
  DIAGNOSTIC_CASE: ${{ inputs.diagnostic_case || '' }}

defaults:
  run:
    shell: bash

jobs:
  select:
    runs-on: runs-on=${{ github.run_id }}/runner=plan/env=production
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      native: ${{ steps.select.outputs.native }}
      riscv: ${{ steps.select.outputs.riscv }}
      cross: ${{ steps.select.outputs.cross }}
      builds: ${{ steps.select.outputs.builds }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      # This job runs no installer; Python still runs through the catalog-pinned uv.
      - name: Install the pinned uv
        run: scripts/tooling/uv.sh x86_64-linux >>"$GITHUB_PATH"
      - id: select
        run: scripts/lib/python.sh scripts/ct/ci.py plan

  cross-build:
    needs: select
    if: needs.select.outputs.cross == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.target }}/runner=ct-cross-build/env=production
    timeout-minutes: 45
    name: Prepare ${{ matrix.target }} CT
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.builds) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-build tooling
        uses: ./.github/actions/cross-build/setup
        with:
          target: ${{ matrix.target }}
      - name: Prepare and validate exact target CT binaries
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-transfer
          just ct-full --target "$TARGET" --prepare-archive "target/$TARGET-ct.tar.gz"
      - name: Retain failed CT preparation evidence
        if: failure()
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: ${{ matrix.target }}-ct-preparation-failure-${{ github.run_attempt }}
          path: target/ct/${{ matrix.target }}/release/
          if-no-files-found: warn
          retention-days: 7
      - uses: ./.github/actions/cross-build/upload
        with:
          target: ${{ matrix.target }}
          suite: ct

  ct:
    needs: [select, cross-build]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.native == 'true' && (needs.cross-build.result == 'success' || needs.cross-build.result == 'skipped') }}
    name: ${{ matrix.platform }} (${{ inputs.diagnostic_case && 'diagnostic' || 'full' }})
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Install tooling and run CT (Linux)
        if: runner.os == 'Linux' && !matrix.target
        env:
          DIAGNOSTIC_CASES: ${{ matrix.diagnostic_cases }}
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-ct-full
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          if [[ -n "$DIAGNOSTIC_CASES" ]]; then
            read -ra cases <<< "$DIAGNOSTIC_CASES"
            just ct-full "${cases[@]/#/--dudect-case=}"
          else
            if [[ "$PLATFORM" == x86_64-linux ]]; then just ct-test; fi
            just ct-full
          fi
      - name: Download prepared target CT evidence from this workflow run
        if: matrix.target
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: ${{ matrix.target }}-ct-prepared
          path: target/cross-download
      - name: Measure the prepared binaries on native hardware
        if: matrix.target
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-cross-run "target/cross-download/${{ matrix.target }}-tools.tar.gz"
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          if [[ -n "$DIAGNOSTIC_CASE" ]]; then
            just ct-replay --target "${{ matrix.target }}" --source-root . --archive "target/cross-download/${{ matrix.target }}-ct.tar.gz" --out target/ct/diagnostic --case="$DIAGNOSTIC_CASE" --repetitions 1
          else
            just ct-full --target "${{ matrix.target }}" --run-archive "target/cross-download/${{ matrix.target }}-ct.tar.gz"
          fi
      - name: Install tooling and run CT (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/tooling/x86_64-win.ps1 -CiCt
          just ct-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package CT evidence
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          if [[ -d target/ct ]]; then
            tar -czf "target/ct-${PLATFORM}-full.tar.gz" -C target ct
          fi
      # Windows resolves a bare `bash` to the WSL launcher; use the bundled tar.
      - name: Package CT evidence (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          if (Test-Path target/ct) {
            tar -czf "target/ct-$env:PLATFORM-full.tar.gz" -C target ct
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Retain CT evidence
        if: ${{ !cancelled() }}
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: ct-${{ matrix.platform }}-full
          path: target/ct-${{ matrix.platform }}-full.tar.gz
          if-no-files-found: warn
          retention-days: 7

  # RISC-V runs on a donated runner pool that can stay unavailable for hours. GitHub
  # cannot time out a queued job or cancel one job of a run, so this job dispatches
  # the RISC-V measurement as its own run and skips it when no runner starts it in
  # time. A started run must pass. It sits outside the CT matrix so that only this
  # job, which runs no build or measurement tooling, holds actions: write; the script
  # cancels the dispatched run when another job of this run fails.
  riscv64-linux:
    needs: [select, cross-build]
    if: ${{ !cancelled() && needs.select.outputs.riscv != '' && needs.cross-build.result == 'success' }}
    name: riscv64-linux (${{ inputs.diagnostic_case && 'diagnostic' || 'full' }})
    runs-on: ubuntu-24.04
    # GitHub-hosted jobs stop at six hours; this one waits for the queue and the run.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      # This job runs no installer; Python still runs through the catalog-pinned uv.
      - name: Install the pinned uv
        run: scripts/tooling/uv.sh x86_64-linux >>"$GITHUB_PATH"
      - name: Measure the prepared binaries on RISC-V hardware
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_MINUTES: ${{ inputs.require_riscv && '0' || '30' }}
          REF: ${{ github.ref_name }}
          TIMEOUT_MINUTES: ${{ fromJSON(needs.select.outputs.riscv).timeout }}
        run: >-
          scripts/lib/python.sh scripts/lib/dispatched_run.py run --workflow riscv.yml --ref "$REF" --label RISC-V
          --queue-minutes "$QUEUE_MINUTES" --state "$RUNNER_TEMP/riscv-run"
          --input run_id="$GITHUB_RUN_ID" --input sha="$GITHUB_SHA" --input suite=ct
          --input timeout_minutes="$TIMEOUT_MINUTES" --input diagnostic_case="$DIAGNOSTIC_CASE"
      - name: Cancel the RISC-V run if this job stopped first
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/lib/python.sh scripts/lib/dispatched_run.py cancel --state "$RUNNER_TEMP/riscv-run"
