name: Constant-Time
run-name: Constant-Time

on:
  workflow_call:
    inputs:
      architectures:
        description: Native architectures to qualify; release callers should use all
        type: string
        default: all
  workflow_dispatch:
    inputs:
      architectures:
        description: all, or comma-separated x86_64-linux,aarch64-linux,x86_64-win,s390x-linux,powerpc64le-linux,riscv64-linux
        type: string
        required: true
        default: all

permissions:
  contents: read

env:
  CARGO_RAIL_CACHE: "off"
  INPUT_ARCHITECTURES: ${{ inputs.architectures || 'all' }}

concurrency:
  group: ct-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  select:
    runs-on: runs-on=${{ github.run_id }}/family=c7a+c7i+c8a+c8i+m7a+m7i+m8a+m8i/cpu=2/image=ubuntu24-minimal-x64/spot=price-capacity-optimized/env=production
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      riscv: ${{ steps.select.outputs.riscv }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - id: select
        run: python3 scripts/ct/ci.py plan

  riscv-build:
    needs: select
    if: needs.select.outputs.riscv == 'true'
    runs-on: runs-on=${{ github.run_id }}/family=c7a+c7i+c8a+c8i+m7a+m7i+m8a+m8i/cpu=32/ram=64+128/image=ubuntu24-minimal-x64/spot=price-capacity-optimized/volume=150gb:gp3/env=production
    timeout-minutes: 45
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare and validate exact RISC-V CT binaries
        run: |
          scripts/tooling/x86_64-linux.sh --ci-riscv-build
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-transfer
          just ct-full --target riscv64gc-unknown-linux-gnu --prepare-archive target/riscv-ct.tar.gz
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: riscv-ct-prepared
          path: target/riscv-ct.tar.gz
          if-no-files-found: error
          retention-days: 2

  ct:
    needs: [select, riscv-build]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.riscv-build.result == 'success' || needs.riscv-build.result == 'skipped') }}
    name: ${{ matrix.platform }} (full)
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Install tooling and run CT (Linux)
        if: runner.os == 'Linux' && matrix.platform != 'riscv64-linux'
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-ct-full
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          if [[ "$PLATFORM" == x86_64-linux ]]; then just ct-test; fi
          just ct-full
      - name: Download prepared RISC-V CT evidence from this workflow run
        if: matrix.platform == 'riscv64-linux'
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: riscv-ct-prepared
          path: target/riscv-download
      - name: Measure the prepared binaries on physical RISC-V
        if: matrix.platform == 'riscv64-linux'
        run: |
          scripts/tooling/riscv64-linux.sh --ci-riscv-run
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just ct-full --target riscv64gc-unknown-linux-gnu --run-archive target/riscv-download/riscv-ct.tar.gz
      - name: Install tooling and run CT (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/tooling/x86_64-win.ps1 -CiCt
          just ct-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain CT evidence
        if: ${{ !cancelled() }}
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: ct-${{ matrix.platform }}-full
          path: |
            target/ct/
          if-no-files-found: warn
          retention-days: 7
