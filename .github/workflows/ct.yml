name: Constant-Time
run-name: Constant-Time

on:
  workflow_call:
    inputs:
      architectures:
        description: Native architectures to qualify; release callers should use all
        type: string
        default: all
  workflow_dispatch:
    inputs:
      replay_p384:
        description: Diagnostic only; replay the P-384 binary from run 34672864167 three times on RISC-V
        type: boolean
        default: false
      architectures:
        description: all, or comma-separated x86_64-linux,aarch64-linux,x86_64-win,s390x-linux,powerpc64le-linux,riscv64-linux
        type: string
        required: true
        default: all

permissions:
  contents: read

env:
  CARGO_RAIL_CACHE: "off"
  INPUT_ARCHITECTURES: ${{ inputs.architectures || 'all' }}

concurrency:
  group: ct-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  replay:
    if: github.event_name == 'workflow_dispatch' && inputs.replay_p384
    name: Replay P-384 baseline (diagnostic)
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: 32734d2dfac7a8015e3410c32b4db5e07484e496
          path: target/ct-replay-source
          persist-credentials: false
      - uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: riscv64gc-unknown-linux-gnu-ct-prepared
          run-id: 34672864167
          github-token: ${{ github.token }}
          path: target/ct-replay-download
      - name: Verify original archive and repeat the full sample case
        run: |
          echo 'c551b7e2b4928e4153fd864bed860d4d414a88bdccedf8be8110d4da07377b24  target/ct-replay-download/riscv64gc-unknown-linux-gnu-ct.tar.gz' | sha256sum --check
          scripts/tooling/riscv64-linux.sh --ci-cross-run target/ct-replay-download/riscv64gc-unknown-linux-gnu-tools.tar.gz
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just ct-replay --source-root target/ct-replay-source --archive target/ct-replay-download/riscv64gc-unknown-linux-gnu-ct.tar.gz --out target/ct-replay-results --case ecdsa_p384_public_key_fixed_vs_random_secret
      - name: Retain every repetition and original preparation evidence
        if: ${{ !cancelled() }}
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: ct-p384-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ct-replay-results/
            target/ct-replay-download/
          if-no-files-found: error
          retention-days: 30

  select:
    if: ${{ !inputs.replay_p384 }}
    runs-on: runs-on=${{ github.run_id }}/runner=plan/env=production
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      cross: ${{ steps.select.outputs.cross }}
      builds: ${{ steps.select.outputs.builds }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - id: select
        run: python3 scripts/ct/ci.py plan

  cross-build:
    needs: select
    if: needs.select.outputs.cross == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=cross-build/env=production
    timeout-minutes: 45
    name: Prepare ${{ matrix.target }} CT
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.builds) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare and validate exact target CT binaries
        run: |
          scripts/tooling/x86_64-linux.sh --ci-cross-build "$TARGET"
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-transfer
          just ct-full --target "$TARGET" --prepare-archive "target/$TARGET-ct.tar.gz"
      - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: ${{ matrix.target }}-ct-prepared
          path: |
            target/${{ matrix.target }}-ct.tar.gz
            target/${{ matrix.target }}-tools.tar.gz
          if-no-files-found: error
          retention-days: 2

  ct:
    needs: [select, cross-build]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.cross-build.result == 'success' || needs.cross-build.result == 'skipped') }}
    name: ${{ matrix.platform }} (full)
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Install tooling and run CT (Linux)
        if: runner.os == 'Linux' && !matrix.target
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-ct-full
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          if [[ "$PLATFORM" == x86_64-linux ]]; then just ct-test; fi
          just ct-full
      - name: Download prepared target CT evidence from this workflow run
        if: matrix.target
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: ${{ matrix.target }}-ct-prepared
          path: target/cross-download
      - name: Measure the prepared binaries on native hardware
        if: matrix.target
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-cross-run "target/cross-download/${{ matrix.target }}-tools.tar.gz"
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just ct-full --target "${{ matrix.target }}" --run-archive "target/cross-download/${{ matrix.target }}-ct.tar.gz"
      - name: Install tooling and run CT (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/tooling/x86_64-win.ps1 -CiCt
          just ct-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package CT evidence
        if: ${{ !cancelled() }}
        run: |
          if [[ -d target/ct ]]; then
            tar -czf "target/ct-${PLATFORM}-full.tar.gz" -C target ct
          fi
      - name: Retain CT evidence
        if: ${{ !cancelled() }}
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          path: target/ct-${{ matrix.platform }}-full.tar.gz
          archive: false
          if-no-files-found: warn
          retention-days: 7
