name: Release
run-name: Release rscrypto (${{ inputs.bump }}${{ inputs.dry-run && ', dry run' || '' }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: auto, patch, minor, major, or an exact version
        type: string
        default: auto
      dry-run:
        description: Run every release check without any effect
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_RAIL_CACHE: "off"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      actions: read
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # This job runs no installer; Python still runs through the catalog-pinned uv.
      - name: Install the pinned uv
        run: scripts/tooling/uv.sh x86_64-linux >>"$GITHUB_PATH"
      - name: Install the compiler whose Mac qualification is required
        run: rustup toolchain install "$(scripts/lib/toolchain.sh)" --profile minimal --no-self-update
      - name: Require the source commit's Mac and manual Fuzz qualifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/lib/python.sh scripts/release/release.py preflight

  # Releases wait for RISC-V instead of skipping it; its dispatching jobs need actions: write.
  ci:
    needs: preflight
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      require_riscv: true
    secrets:
      CARGO_RAIL_R2_READ_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID }}
      CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY }}

  ct:
    needs: preflight
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ct.yml
    with:
      architectures: all
      require_riscv: true

  # cargo-rail writes the release commit, tags v<version>, pushes both atomically,
  # publishes to crates.io, and creates the GitHub Release. Its checks gate requires
  # every check on the source commit to pass; this run's qualification jobs gate it here.
  release:
    needs: [ci, ct]
    runs-on: runs-on=${{ github.run_id }}/runner=package/env=production
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      statuses: read
      id-token: write
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the packaging toolchain
        run: |
          scripts/tooling/x86_64-linux.sh --ci-package
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          printf 'PATH=%s\n' "$PATH" >>"$GITHUB_ENV"
      # A dry run also needs the credential: cargo-rail checks it before any effect.
      - name: Authenticate to crates.io
        id: auth
        uses: "rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18" # v1.0.5
      - name: Release with cargo-rail
        id: release
        uses: "loadingalias/cargo-rail-action/release@fd41439dfa862939e6928cb98d7e76de580f673c" # v12.0.0
        with:
          crates: rscrypto
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Require a finished release
        if: ${{ !inputs.dry-run }}
        env:
          STATE: ${{ steps.release.outputs.state }}
        run: '[[ "$STATE" == released ]] || { echo "cargo rail release stopped in state $STATE" >&2; exit 1; }'
