name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_call:
    inputs:
      architectures:
        type: string
        default: all
      duration:
        type: string
        default: '120'
      campaign:
        type: string
        default: smoke
      targets:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      campaign:
        description: Smoke affected targets, or exercise the daily rotation with minimization and coverage
        type: choice
        options: [smoke, daily]
        default: smoke
      architectures:
        description: Native fuzz runners
        type: choice
        options: [x86_64-linux, aarch64-linux, all]
        default: all
      targets:
        description: Exact comma-separated fuzz target names (blank runs all)
        type: string
      duration:
        description: Seconds per target; selection must fit a 30-minute live fuzzing budget
        type: string
        default: '120'

permissions:
  contents: read

env:
  CARGO_RAIL_CACHE: "off"
  RSCRYPTO_FUZZ_LOG_DIR: ${{ github.workspace }}/target/fuzz-logs
  RSCRYPTO_FUZZ_JOBS: "1"

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: ${{ matrix.task }} (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'schedule' || inputs.architectures == 'all') && '["x86_64-linux","aarch64-linux"]' || inputs.architectures == 'aarch64-linux' && '["aarch64-linux"]' || '["x86_64-linux"]') }}
        task: [fuzz]
        include:
          - platform: x86_64-linux
            task: miri
    runs-on: runs-on=${{ github.run_id }}/runner=${{ matrix.task == 'miri' && 'miri' || format('fuzz-{0}', matrix.platform) }}/env=production
    timeout-minutes: ${{ (matrix.task == 'miri' || github.event_name == 'pull_request') && 60 || 90 }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install tooling
        env:
          PLATFORM: ${{ matrix.platform }}
          TASK: ${{ matrix.task }}
        run: |
          scripts/tooling/"$PLATFORM.sh" "--ci-$TASK"
      - name: Miri
        if: matrix.task == 'miri'
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-miri
          just test-miri --rsa
      - name: Plan fuzz campaign
        if: matrix.task == 'fuzz'
        id: plan
        env:
          FUZZ_TARGETS: ${{ inputs.targets }}
          FUZZ_DURATION: ${{ inputs.duration }}
          FUZZ_CAMPAIGN: ${{ inputs.campaign }}
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-fuzz-ci plan
          rustc +"$(scripts/lib/toolchain.sh)" -vV > "$RSCRYPTO_FUZZ_LOG_DIR/compiler.txt"
      - name: Restore corpus checkpoint
        if: matrix.task == 'fuzz'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/fuzz-corpus/
          key: fuzz-corpus-v1-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-v1-${{ matrix.platform }}-
      - name: Build every target and replay every corpus under ASan
        if: matrix.task == 'fuzz'
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-fuzz-ci restore
          just test-fuzz --build --all
          RSCRYPTO_FUZZ_CORPUS=local just test-fuzz-asan --all
      - name: Fuzz selected targets
        if: matrix.task == 'fuzz' && steps.plan.outputs.live == 'true'
        env:
          TARGETS: ${{ steps.plan.outputs.targets }}
          RSCRYPTO_FUZZ_DURATION_SECS: ${{ steps.plan.outputs.duration }}
          RSCRYPTO_FUZZ_TARGET_CONCURRENCY: ${{ steps.plan.outputs.concurrency }}
          RSCRYPTO_FUZZ_BUDGET_SECS: ${{ steps.plan.outputs.budget }}
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-fuzz --all --targets "$TARGETS"
      - name: Prepare corpus checkpoint
        if: matrix.task == 'fuzz'
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-fuzz-ci snapshot
      - name: Minimize daily corpora and report source coverage
        if: matrix.task == 'fuzz' && steps.plan.outputs.retain == 'true'
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          just test-fuzz-ci retain
      - name: Save corpus checkpoint
        if: matrix.task == 'fuzz' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/fuzz-corpus/
          key: fuzz-corpus-v1-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain corpora and crash inputs
        if: ${{ always() && matrix.task == 'fuzz' }}
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: fuzz-${{ matrix.platform }}
          path: |
            target/fuzz-logs/
            target/fuzz-corpus/
            fuzz/artifacts/
            fuzz/corpus/
            fuzz-packages/*/artifacts/
            fuzz-packages/*/corpus/
          if-no-files-found: ignore
          retention-days: 30
