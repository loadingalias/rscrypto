name: Bench

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Linux architecture
        type: choice
        options: [x86_64, aarch64, both]
        default: x86_64
      benches:
        description: Comma-separated benchmark targets from .config/benchmark-matrix.json
        type: string
        required: true
        default: sha2
      filter:
        description: Optional Criterion case regex
        type: string
      sample_size:
        description: Samples per case (blank uses .config/criterion.json)
        type: string
      warmup_ms:
        description: Warmup milliseconds per case (blank uses catalog default)
        type: string
      measure_ms:
        description: Measurement milliseconds per case (blank uses catalog default)
        type: string
      diagnostic:
        description: Enable diagnostic benchmark features
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_RAIL_CACHE: "off"

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: ${{ matrix.architecture }} Linux
    strategy:
      fail-fast: true
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'both' && '["x86_64","aarch64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: runs-on=${{ github.run_id }}/family=${{ matrix.architecture == 'x86_64' && 'c8i.2xlarge' || 'c8g.2xlarge' }}/cpu=8/image=${{ matrix.architecture == 'x86_64' && 'ubuntu24-minimal-x64' || 'ubuntu24-minimal-arm64' }}/spot=false/volume=100gb:gp3/env=production
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install benchmark tooling
        env:
          PLATFORM: ${{ matrix.architecture }}-linux
        run: scripts/tooling/"$PLATFORM.sh" --ci-bench
      - name: Measure selected cases
        env:
          TARGETS: ${{ inputs.benches }}
          FILTER: ${{ inputs.filter }}
          SAMPLES: ${{ inputs.sample_size }}
          WARMUP: ${{ inputs.warmup_ms }}
          MEASURE: ${{ inputs.measure_ms }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          args=("bench=$TARGETS" "output_dir=target/bench" "diag=$DIAGNOSTIC")
          if [[ -n "$FILTER" ]]; then args+=("filter=$FILTER"); fi
          if [[ -n "$SAMPLES" ]]; then args+=("sample_size=$SAMPLES"); fi
          if [[ -n "$WARMUP" ]]; then args+=("warmup_ms=$WARMUP"); fi
          if [[ -n "$MEASURE" ]]; then args+=("measure_ms=$MEASURE"); fi
          just bench "${args[@]}"
          git diff --exit-code HEAD
      - name: Retain benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/bench/
          if-no-files-found: warn
          retention-days: 30
