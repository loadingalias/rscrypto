name: Bench

on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Catalog algorithms, groups, or targets (comma-separated), or all
        type: string
        required: true
        default: sha256
      filter:
        description: Criterion case regex; must match in every selected target (blank = all cases)
        type: string
      x86_64-linux:
        description: Linux x86-64 (Intel and AMD)
        type: boolean
        default: true
      aarch64-linux:
        description: Linux ARM64
        type: boolean
        default: false
      x86_64-win:
        description: Windows x86-64 (Intel and AMD)
        type: boolean
        default: false
      s390x-linux:
        description: Linux IBM Z
        type: boolean
        default: false
      powerpc64le-linux:
        description: Linux IBM POWER
        type: boolean
        default: false
      riscv64-linux:
        description: Linux RISC-V
        type: boolean
        default: false
      diagnostic:
        description: Build diagnostic benchmark features
        type: boolean
        default: false
      sample_size:
        description: Samples per case (blank = .config/criterion.json)
        type: string
      warmup_ms:
        description: Warm-up milliseconds per case (blank = .config/criterion.json)
        type: string
      measure_ms:
        description: Measurement milliseconds per case (blank = .config/criterion.json)
        type: string

permissions:
  contents: read

env:
  CARGO_RAIL_CACHE: "off"
  # The planner and every job read the request from one JSON value; nothing interpolates it into a shell.
  # toJSON spans lines, and Enter-VsDevShell keeps only the first line of a variable,
  # so later jobs read the planner's one-line copy instead.
  DISPATCH_INPUTS: ${{ toJSON(inputs) }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: runs-on=${{ github.run_id }}/runner=plan/env=production
    timeout-minutes: 5
    outputs:
      request: ${{ steps.plan.outputs.request }}
      measurements: ${{ steps.plan.outputs.measurements }}
      cross: ${{ steps.plan.outputs.cross }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      # This job runs no installer; Python still runs through the catalog-pinned uv.
      - name: Install the pinned uv
        run: scripts/tooling/uv.sh x86_64-linux >>"$GITHUB_PATH"
      - id: plan
        run: scripts/lib/python.sh scripts/bench/ci.py plan

  # Each job runs the selected targets of one primitive family, one bounded `just bench` per target.
  # RunsOn starts a host for every queued job, so the planner bounds hosts by job count, not max-parallel.
  # Unique labels keep each job on the host started for it.
  cross-build:
    needs: plan
    if: needs.plan.outputs.cross == 'true'
    name: Prepare ${{ matrix.platform }} / ${{ matrix.family }}
    runs-on: runs-on=${{ github.run_id }}-${{ matrix.target }}-${{ matrix.family }}/runner=bench-cross-build/env=production
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      DISPATCH_INPUTS: ${{ needs.plan.outputs.request }}
      TARGET: ${{ matrix.target }}
      FAMILY: ${{ matrix.family }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross-build tooling
        uses: ./.github/actions/cross-build/setup
        with:
          target: ${{ matrix.target }}
      - name: Cross-build the selected benchmark configurations
        run: |
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          scripts/lib/python.sh scripts/bench/ci.py prepare "$FAMILY" "$TARGET" "target/$TARGET-bench"
          git diff --exit-code HEAD
      - name: Transfer exact benchmark binaries and runner tools
        uses: ./.github/actions/cross-build/upload
        with:
          target: ${{ matrix.target }}
          suite: bench
          artifact: bench-prepared-${{ matrix.platform }}-${{ matrix.family }}
      - name: Retain benchmark preparation evidence
        if: ${{ !cancelled() }}
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: bench-prepare-${{ matrix.platform }}-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/bench/preparation/
          if-no-files-found: warn
          retention-days: 30

  bench:
    needs: [plan, cross-build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.cross-build.result == 'success' || needs.cross-build.result == 'skipped') }}
    name: Measure ${{ matrix.name }} / ${{ matrix.family }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.measurements) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      DISPATCH_INPUTS: ${{ needs.plan.outputs.request }}
      FAMILY: ${{ matrix.family }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: Install tooling and measure (Linux)
        if: runner.os == 'Linux' && !matrix.target
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-bench
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          scripts/lib/python.sh scripts/bench/ci.py run "$FAMILY"
          git diff --exit-code HEAD
      - name: Download prepared benchmark binaries and runner tools
        if: matrix.target
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: bench-prepared-${{ matrix.platform }}-${{ matrix.family }}
          path: target/bench-download
      - name: Discover and measure on native hardware
        if: matrix.target
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          scripts/tooling/"$PLATFORM.sh" --ci-cross-run "target/bench-download/$TARGET-tools.tar.gz"
          source "$HOME/.local/share/rscrypto-tooling/environment.sh"
          scripts/lib/python.sh scripts/bench/ci.py measure "$FAMILY" "$TARGET" "target/bench-download/$TARGET-bench"
          git diff --exit-code HEAD
      - name: Install tooling and measure (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/tooling/x86_64-win.ps1 -CiBench
          uv run python scripts/bench/ci.py run $env:FAMILY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain benchmark evidence
        if: ${{ always() }}
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: bench-${{ matrix.name }}-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/bench/
          if-no-files-found: warn
          retention-days: 30
