name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Primitive or benchmark selectors (comma separated, or all).
        required: false
        type: string
        default: all
      platforms:
        description: Platform aliases (comma separated, or all).
        required: false
        type: string
        default: all
      filter:
        description: Optional benchmark filter.
        required: false
        type: string
      quick:
        description: Use the short measurement profile.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        name: Select platforms
        env:
          BENCH_PLATFORMS: ${{ inputs.platforms }}
          GH_RUN_ID: ${{ github.run_id }}
        run: scripts/ci/emit-manual-matrix.sh bench

  benchmark:
    name: ${{ matrix.display_name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    concurrency:
      group: benchmark-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          contract: ${{ (matrix.platform == 'ibm-s390x' || matrix.platform == 'ibm-power10' || matrix.platform == 'rise-riscv') && 'nightly' || 'development' }}
      - name: Measure
        env:
          BENCH_FILTER: ${{ inputs.filter }}
          BENCH_ONLY: ${{ inputs.targets }}
          BENCH_OUTPUT_DIR: target/benchmark_results
          BENCH_PLATFORM: ${{ matrix.platform }}
          BENCH_QUICK: ${{ inputs.quick }}
          BENCH_RESULTS_DIR: target/benchmark_results
          RSCRYPTO_BENCH_MODE: ci
        run: scripts/ci/run-bench.sh
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ matrix.artifact_suffix }}
          path: target/benchmark_results/
          retention-days: 30
          if-no-files-found: error
