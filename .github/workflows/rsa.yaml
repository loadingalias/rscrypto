name: RSA

on:
  workflow_call:
    inputs:
      artifact_retention_days:
        description: "Retention for RSA evidence artifacts."
        required: false
        type: number
        default: 90
    secrets:
      CARGO_RAIL_R2_READ_ACCESS_KEY_ID:
        description: "Bucket-scoped R2 access key forwarded to RSA compiler jobs."
        required: false
      CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY:
        description: "Bucket-scoped R2 secret key forwarded to RSA compiler jobs."
        required: false
  workflow_dispatch:
    inputs:
      artifact_retention_days:
        description: "Retention for RSA evidence artifacts."
        required: false
        type: number
        default: 90

concurrency:
  group: rsa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RSCRYPTO_TEST_MODE: rsa

permissions:
  contents: read

jobs:
  rsa-miri:
    name: RSA Miri (Linux x64)
    permissions:
      contents: read
    uses: ./.github/workflows/_rust-job.yaml
    with:
      runner: runs-on=${{ github.run_id }}/runner=linux-x64-ci
      timeout_minutes: 60
      tools_mode: minimal
      toolchain_contract: nightly
      toolchain_components: "miri, rust-src"
      operation: rsa-miri
      artifact_name: rsa-miri-linux-x64
      artifact_path: ci-evidence/rsa-miri-linux-x64.log
      artifact_always: true
      artifact_retention_days: ${{ inputs.artifact_retention_days }}
    secrets:
      cache_access_key_id: ${{ secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID }}
      cache_secret_access_key: ${{ secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY }}

  rsa-leakage:
    name: RSA Leakage (${{ matrix.target.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64
            runner: runs-on=${{ github.run_id }}/runner=linux-x64-ci
          - name: linux-arm64
            runner: runs-on=${{ github.run_id }}/runner=linux-arm64-ci
    uses: ./.github/workflows/_rust-job.yaml
    with:
      runner: ${{ matrix.target.runner }}
      timeout_minutes: 180
      tools_mode: minimal
      operation: rsa-leakage
      target: ${{ matrix.target.name }}
      artifact_name: rsa-leakage-${{ matrix.target.name }}
      artifact_path: ci-evidence/rsa-leakage-${{ matrix.target.name }}.log
      artifact_always: true
      artifact_retention_days: ${{ inputs.artifact_retention_days }}
    secrets:
      cache_access_key_id: ${{ secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID }}
      cache_secret_access_key: ${{ secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY }}

  rsa-linux-x86_64-asm:
    name: RSA Assembly (Linux x86-64)
    permissions:
      contents: read
    uses: ./.github/workflows/_rust-job.yaml
    with:
      runner: runs-on=${{ github.run_id }}/runner=linux-x64-ci
      timeout_minutes: 45
      tools_mode: none
      toolchain_components: ""
      operation: rsa-linux-x64-asm
      artifact_name: rsa-linux-x86_64-asm
      artifact_path: ci-evidence/rsa-linux-x86_64-asm.log
      artifact_always: true
      artifact_retention_days: ${{ inputs.artifact_retention_days }}
    secrets:
      cache_access_key_id: ${{ secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID }}
      cache_secret_access_key: ${{ secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY }}

  complete:
    name: Complete (RSA)
    needs: [rsa-miri, rsa-leakage, rsa-linux-x86_64-asm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert RSA lanes passed
        run: |
          failed=0
          for lane in \
            "rsa-miri=${{ needs.rsa-miri.result }}" \
            "rsa-leakage=${{ needs.rsa-leakage.result }}" \
            "rsa-linux-x86_64-asm=${{ needs.rsa-linux-x86_64-asm.result }}"
          do
            name="${lane%%=*}"
            result="${lane#*=}"
            if [ "$result" != "success" ]; then
              echo "FAIL: $name ($result)"
              failed=1
            else
              echo "  OK: $name"
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
