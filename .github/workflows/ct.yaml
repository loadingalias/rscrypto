name: Constant-Time

on:
  workflow_call:
    inputs:
      platforms:
        description: "RUNNERS (Empty/all = non-RISC physical CT lanes; use RISC-V workflow for RISC-V)."
        required: false
        type: string
        default: "all"
      dudect_timeout:
        description: "Timeout in seconds for each per-case dudect command."
        required: false
        type: number
        default: 1800
      dudect_filter:
        description: "Optional comma-separated DudeCT case/name/filter substrings. Empty = all cases in selected gate."
        required: false
        type: string
        default: ""
      dudect_gate:
        description: "DudeCT gate to run: required, diagnostic, or all. Required is release evidence."
        required: false
        type: string
        default: "required"
      binsec_timeout:
        description: "Timeout in seconds for each BINSEC kernel batch on Linux targets."
        required: false
        type: number
        default: 900
      upload_raw_artifacts:
        description: "Upload raw CT build/proof artifacts for release evidence or debugging. Default uploads compact reports only."
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        description: "Retention for CT evidence artifacts."
        required: false
        type: number
        default: 90
      release_tag:
        description: "Existing release tag whose s390x CT lane must be regenerated."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      platforms:
        description: "RUNNERS (Empty/all = non-RISC physical CT lanes; use RISC-V workflow for RISC-V)."
        required: false
        type: string
        default: "all"
      dudect_timeout:
        description: "Timeout in seconds for each per-case dudect command."
        required: false
        type: number
        default: 1800
      dudect_filter:
        description: "Optional comma-separated DudeCT case/name/filter substrings. Empty = all cases in selected gate."
        required: false
        type: string
        default: ""
      dudect_gate:
        description: "DudeCT gate to run: required, diagnostic, or all. Required is release evidence."
        required: false
        type: choice
        options:
          - required
          - diagnostic
          - all
        default: "required"
      binsec_timeout:
        description: "Timeout in seconds for each BINSEC kernel batch on Linux targets."
        required: false
        type: number
        default: 900
      upload_raw_artifacts:
        description: "Upload raw CT build/proof artifacts for release evidence or debugging. Default uploads compact reports only."
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        description: "Retention for CT evidence artifacts."
        required: false
        type: number
        default: 90
      release_tag:
        description: "Existing release tag whose s390x CT lane must be regenerated."
        required: false
        type: string
        default: ""

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RSCRYPTO_CT_MODE: ci

permissions:
  contents: read

jobs:
  plan:
    name: Resolve CT Matrix
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.source.outputs.checkout_ref }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve CT source
        id: source
        shell: bash
        env:
          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
          BINSEC_TIMEOUT: ${{ inputs.binsec_timeout }}
          DUDECT_FILTER: ${{ inputs.dudect_filter }}
          DUDECT_GATE: ${{ inputs.dudect_gate }}
          DUDECT_TIMEOUT: ${{ inputs.dudect_timeout }}
          EVENT_NAME: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPLOAD_RAW_ARTIFACTS: ${{ inputs.upload_raw_artifacts }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "checkout_ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "release CT recovery must run from protected main" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "release CT recovery tag is invalid: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse -q --verify "${RELEASE_TAG}^{tag}" >/dev/null \
            || { echo "release CT recovery requires an annotated tag" >&2; exit 1; }
          if [[ "$PLATFORMS" != "ibm-s390x" || "$DUDECT_GATE" != "required" \
            || -n "$DUDECT_FILTER" || "$UPLOAD_RAW_ARTIFACTS" != "true" \
            || "$ARTIFACT_RETENTION_DAYS" != "90" || "$DUDECT_TIMEOUT" != "1800" \
            || "$BINSEC_TIMEOUT" != "900" ]]; then
            echo "release CT recovery must run the complete raw ibm-s390x lane with release timeouts and 90-day retention" >&2
            exit 1
          fi
          echo "checkout_ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build CT Matrix
        id: plan
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          CT_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: scripts/ci/emit-manual-matrix.sh ct

  ct:
    name: CT Full (${{ matrix.display_name }})
    needs: plan
    if: ${{ needs.plan.outputs.has_targets == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_rust-job.yaml
    with:
      checkout_ref: ${{ needs.plan.outputs.checkout_ref }}
      runner: ${{ matrix.runner }}
      timeout_minutes: ${{ matrix.timeout_minutes }}
      cache_key: ct-${{ matrix.artifact_suffix }}
      tools_mode: ${{ matrix.tools_mode }}
      toolchain_contract: ${{ (matrix.platform == 'ibm-s390x' || matrix.platform == 'ibm-power10' || matrix.platform == 'rise-riscv') && 'nightly' || 'development' }}
      toolchain_components: ${{ matrix.toolchain_components }}
      enable_magic_cache: ${{ matrix.enable_magic_cache }}
      enable_rust_cache: ${{ matrix.enable_rust_cache }}
      operation: constant-time
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      dudect_timeout: ${{ fromJSON(format('{0}', inputs.dudect_timeout)) }}
      dudect_filter: ${{ inputs.dudect_filter }}
      dudect_gate: ${{ inputs.dudect_gate }}
      binsec_timeout: ${{ fromJSON(format('{0}', inputs.binsec_timeout)) }}
      upload_raw_artifacts: ${{ inputs.upload_raw_artifacts }}
      artifact_name: ct-${{ inputs.upload_raw_artifacts && 'raw-' || '' }}${{ matrix.artifact_suffix }}
      artifact_path: target/ct-evidence-package/
      artifact_always: true
      artifact_retention_days: ${{ fromJSON(format('{0}', inputs.artifact_retention_days)) }}

  complete:
    name: Complete (CT)
    needs: [plan, ct]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert CT lanes passed
        shell: bash
        run: |
          set -euo pipefail
          plan="${{ needs.plan.result }}"
          ct="${{ needs.ct.result }}"
          if [[ "$plan" != "success" ]]; then
            echo "CT matrix plan failed: $plan"
            exit 1
          fi
          if [[ "$ct" != "success" ]]; then
            echo "CT full result: $ct"
            exit 1
          fi
          echo "CT full: $ct"
