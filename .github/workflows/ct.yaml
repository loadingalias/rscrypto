name: Constant-time evidence

on:
  workflow_call:
    inputs:
      plan_artifact:
        required: true
        type: string
      plan_identity:
        required: true
        type: string
      head_commit:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: all
      dudect_timeout:
        required: false
        type: number
        default: 1800
      dudect_filter:
        required: false
        type: string
        default: ""
      dudect_gate:
        required: false
        type: string
        default: required
      binsec_timeout:
        required: false
        type: number
        default: 900
      raw:
        required: false
        type: boolean
        default: false
      retention_days:
        required: false
        type: number
        default: 30
  workflow_dispatch:
    inputs:
      platforms:
        description: Platform aliases (comma separated, or all).
        required: false
        type: string
        default: all
      dudect_timeout:
        required: false
        type: number
        default: 1800
      dudect_filter:
        required: false
        type: string
        default: ""
      dudect_gate:
        required: false
        type: choice
        options: [required, diagnostic, all]
        default: required
      binsec_timeout:
        required: false
        type: number
        default: 900
      raw:
        description: Retain raw release evidence.
        required: false
        type: boolean
        default: false
      retention_days:
        required: false
        type: number
        default: 30

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RSCRYPTO_CT_MODE: ci
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head-commit: ${{ steps.commit.outputs.value }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_commit || github.sha }}
          persist-credentials: false
      - uses: $/.github/actions/plan
        if: inputs.plan_artifact != ''
        with:
          artifact: ${{ inputs.plan_artifact }}
          identity: ${{ inputs.plan_identity }}
          head-commit: ${{ inputs.head_commit }}
      - if: inputs.plan_artifact != ''
        run: scripts/ci/require-work.sh assurance.ct
      - id: commit
        run: echo "value=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - id: matrix
        name: Select platforms
        env:
          CT_PLATFORMS: ${{ inputs.platforms }}
          GH_RUN_ID: ${{ github.run_id }}
        run: scripts/ci/emit-manual-matrix.sh ct

  evidence:
    name: ${{ matrix.display_name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head-commit }}
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          contract: ${{ (matrix.platform == 'ibm-s390x' || matrix.platform == 'ibm-power10' || matrix.platform == 'rise-riscv') && 'nightly' || 'development' }}
          components: ${{ matrix.toolchain_components }}
      - name: Install formal-analysis tools
        if: matrix.formal
        run: scripts/ci/install-tools.sh ct-linux
      - name: Build and analyze
        env:
          BINSEC_TIMEOUT: ${{ inputs.binsec_timeout }}
          DUDECT_FILTER: ${{ inputs.dudect_filter }}
          DUDECT_GATE: ${{ inputs.dudect_gate }}
          DUDECT_TIMEOUT: ${{ inputs.dudect_timeout }}
          RAW: ${{ inputs.raw }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --dudect-timeout "$DUDECT_TIMEOUT"
            --binsec-timeout "$BINSEC_TIMEOUT"
            --dudect-filter "$DUDECT_FILTER"
            --dudect-gate "$DUDECT_GATE"
          )
          [[ "$RAW" == true ]] && args+=(--raw)
          scripts/ct/ci.sh "${args[@]}"
      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ct-${{ inputs.raw && 'raw-' || '' }}${{ matrix.artifact_suffix }}
          path: target/ct-evidence-package/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

  complete:
    name: Complete
    needs: [plan, evidence]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [[ "${{ needs.plan.result }}" == success ]]
          [[ "${{ needs.evidence.result }}" == success ]]
