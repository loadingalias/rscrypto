name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    name: Qualification
    permissions:
      contents: read
    uses: $/.github/workflows/qualification.yaml
    with:
      head_commit: ${{ github.sha }}
      mode: release
    secrets:
      CARGO_RAIL_R2_READ_ACCESS_KEY_ID: ${{ secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID }}
      CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY }}

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      crate_name: ${{ steps.preflight.outputs.crate_name }}
      crate_sha256: ${{ steps.preflight.outputs.crate_sha256 }}
      crate_version: ${{ steps.preflight.outputs.crate_version }}
      source_name: ${{ steps.preflight.outputs.source_name }}
      source_sha256: ${{ steps.preflight.outputs.source_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: $/.github/actions/rust
        with:
          cache-url: ${{ vars.CARGO_RAIL_CACHE_URL }}
          cache-mode: ${{ vars.CARGO_RAIL_CACHE_URL != '' && secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID != '' && secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY != '' && 'read' || 'off' }}
          cache-access-key-id: ${{ secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID }}
          cache-secret-access-key: ${{ secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY }}
      - id: preflight
        name: Validate release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/ci/release-preflight.sh --crate rscrypto --tag "$RELEASE_TAG"
      - name: Preserve validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs-${{ github.sha }}
          path: |
            ${{ steps.preflight.outputs.crate_path }}
            ${{ steps.preflight.outputs.source_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish
    needs: [qualification, package]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: $/.github/actions/rust
        with:
          cache-url: ${{ vars.CARGO_RAIL_CACHE_URL }}
          cache-mode: ${{ vars.CARGO_RAIL_CACHE_URL != '' && secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID != '' && secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY != '' && 'read' || 'off' }}
          cache-access-key-id: ${{ secrets.CARGO_RAIL_R2_READ_ACCESS_KEY_ID }}
          cache-secret-access-key: ${{ secrets.CARGO_RAIL_R2_READ_SECRET_ACCESS_KEY }}
      - name: Restore validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-${{ github.sha }}
          path: target/package
      - id: package
        name: Verify validated package
        env:
          CRATE_NAME: ${{ needs.package.outputs.crate_name }}
          CRATE_SHA256: ${{ needs.package.outputs.crate_sha256 }}
          CRATE_VERSION: ${{ needs.package.outputs.crate_version }}
          SOURCE_NAME: ${{ needs.package.outputs.source_name }}
          SOURCE_SHA256: ${{ needs.package.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          crate_path="target/package/$CRATE_NAME"
          source_path="target/package/$SOURCE_NAME"
          actual_crate_sha256="$(sha256sum "$crate_path" | awk '{print $1}')"
          actual_source_sha256="$(sha256sum "$source_path" | awk '{print $1}')"
          [[ "$actual_crate_sha256" == "$CRATE_SHA256" ]] || {
            echo "validated crate changed during artifact transfer" >&2
            exit 1
          }
          [[ "$actual_source_sha256" == "$SOURCE_SHA256" ]] || {
            echo "validated source archive changed during artifact transfer" >&2
            exit 1
          }
          {
            echo "crate_path=$crate_path"
            echo "crate_name=$CRATE_NAME"
            echo "crate_sha256=$CRATE_SHA256"
            echo "crate_version=$CRATE_VERSION"
            echo "source_path=$source_path"
            echo "source_name=$SOURCE_NAME"
            echo "source_sha256=$SOURCE_SHA256"
          } >> "$GITHUB_OUTPUT"
      - name: Download constant-time evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ct-raw-*
          path: ct-release-artifacts
      - id: ct_evidence
        name: Package constant-time evidence
        env:
          CRATE_VERSION: ${{ steps.package.outputs.crate_version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: scripts/ci/package-release-ct-evidence.sh --version "$CRATE_VERSION" --commit "$RELEASE_COMMIT"
      - name: Attest crate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.crate_path }}
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.source_path }}
      - name: Attest constant-time evidence provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.ct_evidence.outputs.bundle_path }}
      - id: existing
        name: Check crates.io
        env:
          CRATE_SHA256: ${{ steps.package.outputs.crate_sha256 }}
          CRATE_VERSION: ${{ steps.package.outputs.crate_version }}
        run: |
          set -euo pipefail
          url="https://crates.io/api/v1/crates/rscrypto/${CRATE_VERSION}/download"
          if curl -fsSL -A "rscrypto-release/${CRATE_VERSION} (https://github.com/loadingalias/rscrypto)" "$url" -o published.crate; then
            published_sha="$(sha256sum published.crate | awk '{print $1}')"
            [[ "$published_sha" == "$CRATE_SHA256" ]] || {
              echo "crates.io already has rscrypto ${CRATE_VERSION} with different bytes" >&2
              exit 1
            }
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        if: steps.existing.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        if: steps.existing.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE_PATH: ${{ steps.package.outputs.crate_path }}
          CRATE_SHA256: ${{ steps.package.outputs.crate_sha256 }}
        run: |
          set -euo pipefail
          cargo publish -p rscrypto --locked
          published_sha="$(sha256sum "$CRATE_PATH" | awk '{print $1}')"
          [[ "$published_sha" == "$CRATE_SHA256" ]] || {
            echo "cargo publish produced different package bytes" >&2
            exit 1
          }
      - name: Verify crates.io package
        env:
          CRATE_SHA256: ${{ steps.package.outputs.crate_sha256 }}
          CRATE_VERSION: ${{ steps.package.outputs.crate_version }}
        run: |
          set -euo pipefail
          url="https://crates.io/api/v1/crates/rscrypto/${CRATE_VERSION}/download"
          for attempt in {1..18}; do
            if curl -fsSL -A "rscrypto-release/${CRATE_VERSION} (https://github.com/loadingalias/rscrypto)" "$url" -o published.crate; then
              published_sha="$(sha256sum published.crate | awk '{print $1}')"
              [[ "$published_sha" == "$CRATE_SHA256" ]] || {
                echo "crates.io returned different package bytes" >&2
                exit 1
              }
              exit 0
            fi
            echo "crates.io package not available yet; retry $attempt/18"
            sleep 10
          done
          echo "timed out waiting for rscrypto ${CRATE_VERSION} on crates.io" >&2
          exit 1
      - name: Write release checksums
        env:
          CRATE_NAME: ${{ steps.package.outputs.crate_name }}
          CRATE_SHA256: ${{ steps.package.outputs.crate_sha256 }}
          SOURCE_NAME: ${{ steps.package.outputs.source_name }}
          SOURCE_SHA256: ${{ steps.package.outputs.source_sha256 }}
          CT_BUNDLE_NAME: ${{ steps.ct_evidence.outputs.bundle_name }}
          CT_BUNDLE_SHA256: ${{ steps.ct_evidence.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          {
            printf '%s  %s\n' "$CRATE_SHA256" "$CRATE_NAME"
            printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_NAME"
            printf '%s  %s\n' "$CT_BUNDLE_SHA256" "$CT_BUNDLE_NAME"
          } > SHA256SUMS
      - name: Attest release checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE_NAME: ${{ steps.package.outputs.crate_name }}
          CRATE_PATH: ${{ steps.package.outputs.crate_path }}
          CRATE_SHA256: ${{ steps.package.outputs.crate_sha256 }}
          SOURCE_NAME: ${{ steps.package.outputs.source_name }}
          SOURCE_PATH: ${{ steps.package.outputs.source_path }}
          SOURCE_SHA256: ${{ steps.package.outputs.source_sha256 }}
          CT_BUNDLE_NAME: ${{ steps.ct_evidence.outputs.bundle_name }}
          CT_BUNDLE_PATH: ${{ steps.ct_evidence.outputs.bundle_path }}
          CT_BUNDLE_SHA256: ${{ steps.ct_evidence.outputs.bundle_sha256 }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Release tag: \`${RELEASE_TAG}\`
          Release commit: \`${RELEASE_COMMIT}\`

          See [CHANGELOG.md](https://github.com/loadingalias/rscrypto/blob/${RELEASE_COMMIT}/CHANGELOG.md) for changes.

          Crate artifact: \`${CRATE_NAME}\`
          SHA-256: \`${CRATE_SHA256}\`

          Source archive: \`${SOURCE_NAME}\`
          SHA-256: \`${SOURCE_SHA256}\`

          Constant-time evidence bundle: \`${CT_BUNDLE_NAME}\`
          SHA-256: \`${CT_BUNDLE_SHA256}\`
          Qualification and publication run: ${RELEASE_RUN}
          EOF

          scripts/ci/publish-immutable-release.sh \
            --tag "$RELEASE_TAG" \
            --title "rscrypto $RELEASE_TAG" \
            --notes "$notes_file" \
            --asset "$CRATE_PATH" \
            --asset "$SOURCE_PATH" \
            --asset "$CT_BUNDLE_PATH" \
            --asset SHA256SUMS
