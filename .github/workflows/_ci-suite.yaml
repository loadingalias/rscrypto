name: _ci-suite

# Cargo Rail owns row selection. This workflow only maps selected, typed rows
# onto repository-owned commands and runner policy.
on:
  workflow_call:
    inputs:
      matrix:
        description: "Strict Cargo Rail ci-suite matrix object."
        required: true
        type: string
      plan_artifact:
        description: "Artifact containing the exact plan and its strict reader."
        required: true
        type: string
      plan_identity:
        description: "Root-independent identity of the exact plan."
        required: true
        type: string
      plan_head_commit:
        description: "Immutable checkout commit bound to the plan."
        required: true
        type: string
      supply_chain_mode:
        description: "'light' (advisories) or 'full' (deny all plus audit)."
        required: true
        type: string
      test_mode:
        description: "Test mode passed to rscrypto test scripts."
        required: false
        type: string
        default: local
      artifact_retention_days:
        description: "Retention for evidence artifacts produced by this suite."
        required: false
        type: number
        default: 90
      cache_mode:
        description: "Provider-enforced Cargo Rail cache authority for selected work."
        required: false
        type: string
        default: read
    secrets:
      cache_access_key_id:
        description: "Caller-selected bucket-scoped R2 access key for the selected cache mode."
        required: false
      cache_secret_access_key:
        description: "Caller-selected bucket-scoped R2 secret key for the selected cache mode."
        required: false

permissions:
  contents: read

jobs:
  selected:
    name: ${{ matrix.work.display_name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    uses: ./.github/workflows/_rust-job.yaml
    with:
      runner: ${{ matrix.work.runner_type == 'runson' && format('runs-on={0}/runner={1}', github.run_id, matrix.work.runner) || matrix.work.runner }}
      timeout_minutes: ${{ matrix.work.timeout_minutes }}
      tools_mode: ${{ matrix.work.tools_mode }}
      toolchain_contract: ${{ matrix.work.toolchain_contract }}
      toolchain_components: ${{ matrix.work.toolchain_components }}
      cache_mode: ${{ inputs.cache_mode }}
      operation: ${{ matrix.work.operation }}
      target: ${{ matrix.work.target || '' }}
      test_mode: ${{ inputs.test_mode }}
      supply_chain_mode: ${{ inputs.supply_chain_mode }}
      plan_artifact: ${{ inputs.plan_artifact }}
      plan_identity: ${{ inputs.plan_identity }}
      plan_head_commit: ${{ inputs.plan_head_commit }}
      artifact_name: ${{ matrix.work.operation == 'cargo-graph' && format('cargo-graph-{0}', inputs.test_mode) || '' }}
      artifact_path: ${{ matrix.work.operation == 'cargo-graph' && 'target/cargo-rail/unify-result.json' || '' }}
      artifact_always: true
      artifact_retention_days: ${{ inputs.artifact_retention_days }}
    secrets:
      cache_access_key_id: ${{ secrets.cache_access_key_id }}
      cache_secret_access_key: ${{ secrets.cache_secret_access_key }}
