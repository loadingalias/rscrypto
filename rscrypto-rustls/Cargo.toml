[package]
name = "rscrypto-rustls"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
description = "TLS 1.3 cryptographic provider for rustls, backed by rscrypto"
license = "MIT OR Apache-2.0"
authors = ["loadingalias"]
repository = "https://github.com/loadingalias/rscrypto"
readme = "README.md"
keywords = ["cryptography", "tls", "rustls"]
categories = ["cryptography", "network-programming"]

[lints]
workspace = true

[features]
default = [
  "sha2",
  "hmac",
  "hkdf",
  "aes-gcm",
  "chacha20poly1305",
  "x25519",
  "p256-ecdh",
  "p384-ecdh",
  "ml-kem",
  "ecdsa-p256",
  "ecdsa-p384",
  "ed25519",
  "rsa",
  "getrandom",
]
sha2 = ["rscrypto/sha2"]
hmac = ["rscrypto/hmac"]
hkdf = ["rscrypto/hkdf"]
aes-gcm = ["rscrypto/aes-gcm"]
chacha20poly1305 = ["rscrypto/chacha20poly1305"]
x25519 = ["rscrypto/x25519"]
p256-ecdh = ["rscrypto/p256-ecdh"]
p384-ecdh = ["rscrypto/p384-ecdh"]
ml-kem = ["rscrypto/ml-kem"]
ecdsa-p256 = ["rscrypto/ecdsa-p256"]
ecdsa-p384 = ["rscrypto/ecdsa-p384"]
ed25519 = ["rscrypto/ed25519"]
rsa = ["rscrypto/rsa"]
ml-dsa = ["rscrypto/ml-dsa"]
getrandom = ["rscrypto/getrandom", "dep:getrandom"]
portable-only = ["rscrypto/portable-only"]
# Integration support uses the same primitive leaf features as ordinary TLS.
quinn = ["dep:quinn-proto", "dep:bytes", "aes-gcm", "hkdf", "getrandom"]

[dependencies]
rscrypto = { version = "0.11.0", path = "..", default-features = false, features = ["std"] }
rustls = { version = "=0.24.0-dev.2", git = "https://github.com/rustls/rustls", rev = "7ebba67075b0c3c2b8fe20c470d5c53410866544", default-features = false, features = ["webpki"] }
rustls-webpki = { version = "=0.104.0-alpha.7", default-features = false, features = ["alloc", "std"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", optional = true }
zeroize = { version = "1.9.1", default-features = false }
quinn-proto = { version = "=0.12.0", git = "https://github.com/quinn-rs/quinn", rev = "9d729c1b6b7ad30d45d40265037eeeb9d98a7420", default-features = false, optional = true }
bytes = { version = "1.12.1", optional = true }

[dev-dependencies]
rustls-aws-lc-rs = { version = "=0.1.0-dev.1", git = "https://github.com/rustls/rustls", rev = "7ebba67075b0c3c2b8fe20c470d5c53410866544" }
rustls-ring = { version = "=0.1.0-dev.1", git = "https://github.com/rustls/rustls", rev = "7ebba67075b0c3c2b8fe20c470d5c53410866544" }
rustls-util = { version = "=0.1.0-dev.1", git = "https://github.com/rustls/rustls", rev = "7ebba67075b0c3c2b8fe20c470d5c53410866544", default-features = false }
quinn = { version = "=0.12.0", git = "https://github.com/quinn-rs/quinn", rev = "9d729c1b6b7ad30d45d40265037eeeb9d98a7420", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "time", "io-util"] }

[[example]]
name = "interop"
required-features = ["getrandom", "hkdf", "aes-gcm"]

[[example]]
name = "quic_interop"
required-features = ["quinn"]
