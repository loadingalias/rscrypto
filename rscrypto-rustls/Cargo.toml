[package]
name = "rscrypto-rustls"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
description = "TLS 1.3 and opt-in TLS 1.2 cryptographic provider for rustls, backed by rscrypto"
license = "Apache-2.0"
authors = ["loadingalias"]
repository = "https://github.com/loadingalias/rscrypto"
readme = "README.md"
keywords = ["cryptography", "tls", "rustls"]
categories = ["cryptography", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = [
  "sha2",
  "hmac",
  "hkdf",
  "aes-gcm",
  "chacha20poly1305",
  "x25519",
  "p256-ecdh",
  "p384-ecdh",
  "ml-kem",
  "ecdsa-p256",
  "ecdsa-p384",
  "ed25519",
  "rsa",
  "getrandom",
]
sha2 = ["rscrypto/sha2"]
hmac = ["rscrypto/hmac"]
hkdf = ["rscrypto/hkdf"]
aes-gcm = ["rscrypto/aes-gcm"]
chacha20poly1305 = ["rscrypto/chacha20poly1305"]
x25519 = ["rscrypto/x25519"]
p256-ecdh = ["rscrypto/p256-ecdh"]
p384-ecdh = ["rscrypto/p384-ecdh"]
ml-kem = ["rscrypto/ml-kem"]
ecdsa-p256 = ["rscrypto/ecdsa-p256"]
ecdsa-p384 = ["rscrypto/ecdsa-p384"]
ed25519 = ["rscrypto/ed25519"]
rsa = ["rscrypto/rsa"]
ml-dsa = ["rscrypto/ml-dsa"]
# Composite ML-DSA (draft-ietf-tls-composite-mldsa-00) with provisional,
# IANA-unassigned SignatureScheme codepoints; see `verify::MLDSA65_ED25519_SHA512`.
mldsa65-ed25519 = ["rscrypto/mldsa65-ed25519"]
mldsa65-ecdsa-p256 = ["rscrypto/mldsa65-ecdsa-p256"]
getrandom = ["rscrypto/getrandom", "dep:getrandom"]
chacha20-rng = ["rscrypto/chacha20-rng"]
portable-only = ["rscrypto/portable-only"]

[dependencies]
rscrypto = { version = "0.13.0", path = "..", default-features = false, features = ["std"] }
rustls = { version = "=0.24.0-dev.3", default-features = false, features = ["webpki"] }
rustls-webpki = { version = "=0.104.0-alpha.8", default-features = false, features = ["alloc", "std"] }
rustls-pki-types = { version = "=1.16.0", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", optional = true }
zeroize = { version = "1.9.1", default-features = false }

[dev-dependencies]
aes = "0.9.4"
rustls-aws-lc-rs = "=0.24.0-dev.3"
rustls-ring = "=0.24.0-dev.3"

[[example]]
name = "interop"
required-features = ["getrandom", "hkdf", "aes-gcm"]
