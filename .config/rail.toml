# Additional target-resolution and compiler-evidence views owned by
# .config/target-matrix.json and docs/platforms.md.
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "aarch64-unknown-none",
  "powerpc64le-unknown-linux-gnu",
  "riscv32imac-unknown-none-elf",
  "riscv64gc-unknown-linux-gnu",
  "s390x-unknown-linux-gnu",
  "thumbv6m-none-eabi",
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-none",
]

[unify]
include_renamed = true
strict_version_compat = true
exact_pin_handling = "warn"
major_version_conflict = "warn"
skip_undeclared_patterns = [] # Every feature spelling is actionable in this crate.
consumer_scope = "open" # Published library: external consumers may activate dormant public features.
msrv_policy = { mode = "disabled" } # Cargo.toml owns the tested package MSRV.

[surface]
# Cargo Rail 0.25 cannot distinguish expected `compile_fail` doctest invocations from compiler failures.
enabled = false
consumer_scope = "open" # Published library: external consumers remain part of the visibility boundary.

[plan.work."policy.repository"]
scope = "repository"
paths = [
  ".config/benchmark-matrix.json",
  ".config/nextest.toml",
  ".config/target-matrix.json",
  "Cargo.lock",
  "Cargo.toml",
  "benches/**",
  "build.rs",
  "ct.toml",
  "deny.toml",
  "examples/**",
  "scripts/check/**",
  "scripts/bench/benchmark_catalog.py",
  "scripts/bench/benchmark_catalog_test.py",
  "scripts/ct/*.py",
  "src/**",
  "testdata/**",
  "tests/**",
]

[plan.work."contracts.features"]
scope = "variants"
paths = [
  ".config/feature-matrix.json",
  ".config/rail.toml",
