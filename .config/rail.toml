# cargo-rail configuration
# Documentation: https://github.com/loadingalias/cargo-rail

# Additional supported Cargo target-resolution views; not a compiler/linker execution matrix.
targets = [
  # Tier 1 (Guaranteed)
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  # Tier 2 (Common)
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-musl",
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
  "x86_64-unknown-linux-musl",
  # Other
  "aarch64-unknown-none",
  "powerpc64le-unknown-linux-gnu",
  "riscv32imac-unknown-none-elf",
  "riscv64gc-unknown-linux-gnu",
  "s390x-unknown-linux-gnu",
  "thumbv6m-none-eabi",
  "x86_64-unknown-none",
]

[unify]
# Renamed declarations are part of this crate's intentional multi-version oracle graph.
include_renamed = true
# Every feature spelling is actionable; unexpected cfg names must not be silently borrowed.
skip_undeclared_patterns = []
# Each package manifest owns its public MSRV; the provider matches rscrypto.
msrv_policy = { mode = "disabled" }

# Plan uses Cargo-Rail's built-in Cargo work. Add no repository work without a matching executor.

[surface]
# Manual pre-release gate. Keep planner selection disabled by omitting `enabled = true`.
targets = "workspace"

[release]
# `release.yml` runs `cargo rail release` with the defaults: publish to crates.io, create the
# GitHub Release, and require every check on the source commit to pass.
# rscrypto-rustls depends on rscrypto, so Cargo-Rail uploads rscrypto first.
crates = ["rscrypto", "rscrypto-rustls"]
# Releases must have conclusive compatibility evidence.
semver_check = "deny"
# Keep the existing `v<version>` tag line, so planning finds the previous release.
tag_format = "v{version}"
# Keep the fuzz and tools lockfiles on the released package version.
auxiliary_cargo_manifests = ["fuzz/Cargo.toml", "tools/Cargo.toml"]

[crates.rscrypto-rustls.release]
tag_format = "{crate}-v{version}"
