# Additional target-resolution and compiler-evidence views owned by
# .config/target-matrix.json and docs/platforms.md.
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "aarch64-unknown-none",
  "powerpc64le-unknown-linux-gnu",
  "riscv32imac-unknown-none-elf",
  "riscv64gc-unknown-linux-gnu",
  "s390x-unknown-linux-gnu",
  "thumbv6m-none-eabi",
  "wasm32-unknown-unknown",
  "wasm32-wasip1",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-none",
]

[unify]
include_renamed = true
strict_version_compat = true
exact_pin_handling = "warn"
major_version_conflict = "warn"
skip_undeclared_patterns = [] # Every feature spelling is actionable in this crate.
consumer_scope = "open" # Published library: external consumers may activate dormant public features.
msrv_policy = { mode = "disabled" } # Cargo.toml owns the tested package MSRV.

[surface]
enabled = true
consumer_scope = "open" # Published library: external consumers remain part of the visibility boundary.

[release]
source = "changes"
tag_format = "{prefix}{version}"
sign_tags = true
require_change_files = true
require_changelog_entries = true
require_release_notes = true
pre_1_breaking_bump = "minor"
# Before 1.0, reviewed minor releases may deliberately replace unstable API
# shapes. Re-enable compiler-backed SemVer enforcement when rscrypto adopts a
# stable compatibility contract.
semver_check = "off"
change_dir = ".changes"
remote_effects = "push" # The repository workflow, not Cargo Rail, owns forge release publication.
auxiliary_cargo_manifests = [
  "fuzz-packages/aead-aegis256/Cargo.toml",
  "fuzz-packages/aead-aes-siv-cmac256/Cargo.toml",
  "fuzz-packages/aead-aes128gcm/Cargo.toml",
  "fuzz-packages/aead-aes128gcmsiv/Cargo.toml",
  "fuzz-packages/aead-aes256gcm/Cargo.toml",
  "fuzz-packages/aead-aes256gcmsiv/Cargo.toml",
  "fuzz-packages/aead-ascon128/Cargo.toml",
  "fuzz-packages/aead-chacha20poly1305/Cargo.toml",
  "fuzz-packages/aead-header-protection/Cargo.toml",
  "fuzz-packages/aead-nonce-counter/Cargo.toml",
  "fuzz-packages/aead-xchacha20poly1305/Cargo.toml",
  "fuzz-packages/auth-argon2/Cargo.toml",
  "fuzz-packages/auth-ed25519/Cargo.toml",
  "fuzz-packages/auth-hkdf/Cargo.toml",
  "fuzz-packages/auth-hmac/Cargo.toml",
  "fuzz-packages/auth-kmac256/Cargo.toml",
  "fuzz-packages/auth-pbkdf2/Cargo.toml",
  "fuzz-packages/auth-phc/Cargo.toml",
  "fuzz-packages/auth-scrypt/Cargo.toml",
  "fuzz-packages/auth-x25519/Cargo.toml",
  "fuzz-packages/checksums-crc16/Cargo.toml",
