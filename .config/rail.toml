[release.changelog]
path = "CHANGELOG.md"
relative_to = "workspace"

[plan.work.ci-policy]
scope = "repository"
paths = [
  ".cargo/**",
  ".config/ci-tool-archives.tsv",
  ".config/toolchains.toml",
  ".github/**",
  "justfile",
  "rust-toolchain.toml",
  "scripts/ci/check-ci-ownership.sh",
  "scripts/ci/install-tools.sh",
  "scripts/ci/materialize-rail-plan.sh",
  "scripts/ci/run-rust-job.sh",
  "scripts/ci/setup-toolchain.sh",
  "scripts/lib/**",
]

[plan.work.ci-suite]
scope = "variants"
cargo = ["cargo.build", "cargo.clippy", "cargo.doc", "cargo.doctest", "cargo.test"]
variant_catalog = ".config/ci-plan-variants.json"
