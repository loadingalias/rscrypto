nextest-version = { required = "0.9.143", recommended = "0.9.143" }

[profile.default]
status-level = "pass"
success-output = "never"
failure-output = "immediate"
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 0

[[profile.default.overrides]]
filter = 'binary(=rsa_public_key) & test(=generated_modern_private_key_outputs_verify_and_decrypt_with_external_oracles)'
slow-timeout = { period = "60s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & test(=wycheproof_rsaes_pkcs1v15_3072_decrypt_vectors_match_expected_results)'
slow-timeout = { period = "60s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & (test(=wycheproof_oaep_mgf1sha1_vectors_are_rejected_by_sha2_mgf1sha2_profiles) | test(=wycheproof_pkcs1v15_sha2_sig_gen_vectors_match_expected_signatures))'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & test(=wycheproof_oaep_sha2_decrypt_vectors_match_expected_results)'
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.commit]
status-level = "fail"
success-output = "never"
failure-output = "immediate-final"
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 4 }
retries = 0

[profile.commit.junit]
path = "junit.xml"
report-name = "cargo-rail-tests"
store-success-output = false
store-failure-output = true

[profile.weekly]
status-level = "pass"
success-output = "never"
failure-output = "immediate"
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 8 }
retries = 0
