nextest-version = { required = "0.9.143", recommended = "0.9.146" }

[profile.default]
status-level = "pass"
success-output = "never"
failure-output = "immediate"
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 0

[[profile.default.overrides]]
filter = 'binary(=aead_kernel_equivalence)'
success-output = "immediate"

[[profile.default.overrides]]
filter = 'binary(=rsa_public_key) & test(=generated_modern_private_key_outputs_verify_and_decrypt_with_external_oracles)'
slow-timeout = { period = "60s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & test(=wycheproof_rsaes_pkcs1v15_3072_decrypt_vectors_match_expected_results)'
slow-timeout = { period = "60s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & (test(=wycheproof_oaep_mgf1sha1_vectors_are_rejected_by_sha2_mgf1sha2_profiles) | test(=wycheproof_pkcs1v15_sha2_sig_gen_vectors_match_expected_signatures))'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & test(=wycheproof_oaep_sha2_decrypt_vectors_match_expected_results)'
slow-timeout = { period = "60s", terminate-after = 4 }

# Each runs 26 SLH-DSA small-set ACVP signatures (or 240 key generations)
# portably at the test profile's opt-level 1.
[[profile.default.overrides]]
filter = 'binary(=rscrypto) & (test(/^auth::slhdsa::tests::acvp_signing_.*s_(deterministic|hedged)$/) | test(=auth::slhdsa::tests::acvp_key_generation_matches_all_cases))'
slow-timeout = { period = "60s", terminate-after = 8 }

# Each makes about eleven small-set signatures across rscrypto and two oracles.
# Native RISC-V takes about 14 s per SHAKE-192s signature, so these exceeded
# the 120 s default in CI 38075894796, as did the portable macOS run of 35f3582c.
[[profile.default.overrides]]
filter = 'binary(=slhdsa) & test(/^(sha2|shake)_(128|192|256)s_matches_independent_implementations$/)'
slow-timeout = { period = "60s", terminate-after = 8 }

# Cross-target suites (RISC-V, POWER, IBM Z) run on slow native hardware;
# `scripts/test/cross.py` selects these profiles. The SLH-DSA small-set
# independent-implementation differentials run only on the native rows, and the
# internal evidence suites leave the SLH-DSA ACVP vectors to the ordinary suite
# with the same dispatch on the same target. Overrides above still apply.
[profile.cross]
default-filter = 'not (binary(=slhdsa) & test(/_(128|192|256)s_matches_independent_implementations$/))'

[profile.cross-internal]
default-filter = 'not (binary(=rscrypto) & test(/^auth::slhdsa::tests::acvp_/))'
