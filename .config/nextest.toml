nextest-version = { required = "0.9.143", recommended = "0.9.151" }

[profile.default]
status-level = "pass"
success-output = "never"
failure-output = "immediate"
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "30s", terminate-after = 4 }
retries = 0

[[profile.default.overrides]]
filter = 'test(/^backend::chacha20::kernel_tests::/)'
success-output = "immediate"

# Show the reason when a CPU without AES-NI skips the AES-NI/PCLMUL tier test.
[[profile.default.overrides]]
filter = 'binary(=aes_gcm_aesni_tier)'
success-output = "immediate"

[[profile.default.overrides]]
filter = 'binary(=rsa_public_key) & test(=generated_modern_private_key_outputs_verify_and_decrypt_with_external_oracles)'
slow-timeout = { period = "60s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & test(=wycheproof_rsaes_pkcs1v15_3072_decrypt_vectors_match_expected_results)'
slow-timeout = { period = "60s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & (test(=wycheproof_oaep_mgf1sha1_vectors_are_rejected_by_sha2_mgf1sha2_profiles) | test(=wycheproof_pkcs1v15_sha2_sig_gen_vectors_match_expected_signatures))'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(=rsa_wycheproof) & test(=wycheproof_oaep_sha2_decrypt_vectors_match_expected_results)'
slow-timeout = { period = "60s", terminate-after = 4 }

# Each runs 26 SLH-DSA small-set ACVP signatures (or 276 key generations)
# portably at the test profile's opt-level 1.
[[profile.default.overrides]]
filter = 'binary(=rscrypto) & (test(/^auth::slhdsa::tests::acvp_signing_.*s_(deterministic|hedged)$/) | test(=auth::slhdsa::tests::acvp_key_generation_matches_all_cases))'
slow-timeout = { period = "60s", terminate-after = 8 }

# Each makes about eleven small-set signatures across rscrypto and two oracles.
# Native RISC-V takes about 14 s per SHAKE-192s signature, so these exceeded
# the 120 s default in CI 38075894796, as did the portable macOS run of 35f3582c.
[[profile.default.overrides]]
filter = 'binary(=slhdsa) & test(/^(sha2|shake)_(128|192|256)s_matches_independent_implementations$/)'
slow-timeout = { period = "60s", terminate-after = 8 }

# The provider's TLS profile matrices run full handshakes for each suite, group, and
# signature scheme. On the IBM Z runner, CI 44519739337 measured p384_profiles at 112 s
# and stopped rsa_profiles at the 120 s default.
[[profile.default.overrides]]
filter = 'package(=rscrypto-rustls) & test(/^tests::(profiles|tls12)::[a-z0-9_]+_profiles$/)'
slow-timeout = { period = "60s", terminate-after = 8 }

# Cross-target suites (RISC-V, POWER, IBM Z) run on slow native hardware;
# `scripts/test/cross.py` selects these profiles. The SLH-DSA small-set
# independent-implementation differentials run on native rows.
[profile.cross]
default-filter = 'not (binary(=slhdsa) & test(/_(128|192|256)s_matches_independent_implementations$/))'

# QEMU user-mode emulation (`cross.py run --emulated`, the RISC-V QEMU workflow) executes each
# instruction in software. That lane exists to run each extension kernel against the portable
# authority, which the direct kernel tests do. SLH-DSA signing chains millions of hash calls
# through the same kernels and runs on every native row, so these profiles skip it. Every other
# test gets 16 minutes; the catch-all override outranks the default profile's per-test overrides.
[profile.emulated]
default-filter = 'not (binary(=slhdsa) | binary(=slhdsa_pkix) | (binary(=rscrypto) & test(/^auth::slhdsa::tests::acvp_signing_/)))'

[[profile.emulated.overrides]]
filter = 'all()'
slow-timeout = { period = "120s", terminate-after = 8 }
