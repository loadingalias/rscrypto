# Updated by just update on the local macOS workstation.
# Installers consume these pins; they never select latest releases.
# Ubuntu system packages are pinned together by archive snapshot.
# Rust and its components are owned by rust-toolchain.toml.

[cargo]
cargo-audit = "0.22.2"
cargo-deny = "0.20.2"
cargo-nextest = "0.9.144"
cargo-mutants = "27.1.0"
just = "1.58.0"
ripgrep = "15.2.0"
rumdl = "0.2.71"
lychee = "0.24.2"
samply = "0.13.1"
gungraun-runner = "0.19.4"
cargo-fuzz = "0.13.2"

[updater]
tomlkit = "0.15.1"
PyYAML = "6.0.3"

[versions]
cargo-rail = "0.25.0"
cargo-binstall = "1.23.0"
llvm = "23.1.1"
cmake = "4.4.3"
wasmtime = "48.0.2"
git = "2.55.0.windows.5"
jq = "1.8.2"
powershell = "7.6.6"
rustup = "1.29.1"
python = "3.14.7"
zig = "0.16.0"
nasm = "3.02"

[linux]
ubuntu = "26.04"
codename = "resolute"
snapshot = "20260911T040925Z"
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "pkgconf", "python3", "python3-venv", "unzip", "xz-utils", "zstd", "ninja-build", "libssl-dev", "perl", "m4", "shellcheck"]

[ci]
cargo = ["just", "cargo-nextest"]

[ci-riscv-build]
cargo = ["just", "cargo-nextest"]
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "python3", "cmake", "clang", "libclang-dev", "perl", "gcc-riscv64-linux-gnu", "g++-riscv64-linux-gnu", "libc6-dev-riscv64-cross"]

[ci-riscv-run]
cargo = ["just", "cargo-nextest"]
packages = ["ca-certificates", "curl", "git", "python3"]

[ci-compat]
cargo = ["just"]
assets = ["wasmtime"]
packages = ["build-essential", "ca-certificates", "curl", "git", "python3"]
workers = 8

[ci-package]
cargo = ["just"]

[ci-fuzz]
cargo = ["just", "cargo-fuzz"]
components = []
nightly-components = ["rust-src"]
packages = ["build-essential", "ca-certificates", "curl", "git", "python3", "clang"]

[ci-miri]
cargo = ["just"]
components = []
nightly-components = ["miri", "rust-src"]
packages = ["build-essential", "ca-certificates", "curl", "git", "python3"]

[ci-ct]
cargo = ["just"]
components = ["llvm-tools"]
packages = ["build-essential", "ca-certificates", "curl", "git", "python3"]

[ci-ct-proof]
opam-repository = "git+https://github.com/ocaml/opam-repository.git#40d8ad2a8bbef64bd1b88f2d61427310538bfcec"
compiler = "ocaml-base-compiler.5.4.1"
# Match the engine, solver, and decoder used by the existing selector proofs.
opam = ["binsec.0.11.1", "bitwuzla.1.0.6", "unisim_archisec.0.0.14"]
packages = ["opam", "pkg-config", "libgmp-dev", "autoconf", "bison", "flex", "m4", "unzip", "bubblewrap"]

[ci-bench]
cargo = ["just"]
components = []

[ci-musl]
packages = ["musl-tools"]

[ci-policy]
cargo = ["cargo-deny", "cargo-audit"]

[linux-ci]
ubuntu = "24.04"
codename = "noble"
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "python3", "cmake", "clang", "libclang-dev", "perl"]

