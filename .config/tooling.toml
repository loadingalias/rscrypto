# Updated by just update on the local macOS workstation.
# Installers consume these pins; they never select latest releases.
# Ubuntu system packages are pinned together by archive snapshot.
# Rust and its components are owned by rust-toolchain.toml.

[cargo]
cargo-audit = "0.22.2"
cargo-deny = "0.20.2"
cargo-nextest = "0.9.143"
cargo-mutants = "27.1.0"
just = "1.58.0"
ripgrep = "15.2.0"
rumdl = "0.2.66"
lychee = "0.24.2"
samply = "0.13.1"
gungraun-runner = "0.19.4"
cargo-fuzz = "0.13.2"

[updater]
tomlkit = "0.15.1"
PyYAML = "6.0.3"

[versions]
cargo-rail = "0.25.0"
cargo-binstall = "1.23.0"
llvm = "23.1.0"
cmake = "4.4.3"
wasmtime = "48.0.1"
git = "2.55.0.windows.5"
jq = "1.8.2"
powershell = "7.6.5"
rustup = "1.29.1"
python = "3.14.7"
zig = "0.16.0"
nasm = "3.02"

[linux]
ubuntu = "26.04"
codename = "resolute"
snapshot = "20260906T054640Z"
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "pkgconf", "python3", "python3-venv", "unzip", "xz-utils", "zstd", "ninja-build", "libssl-dev", "perl", "m4", "shellcheck"]

[ci]
cargo = ["just", "cargo-nextest"]

[ci-compat]
cargo = ["just"]
assets = ["wasmtime"]
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "python3"]
workers = 8

[ci-fuzz]
cargo = ["just", "cargo-fuzz"]
components = []
nightly-components = ["rust-src"]
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "python3", "clang"]

[ci-ct]
cargo = ["just"]
components = ["llvm-tools"]
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "python3"]

[ci-musl]
packages = ["musl-tools"]

[ci-policy]
cargo = ["cargo-deny", "cargo-audit"]

