# Updated by just update on the local macOS workstation.
# Installers consume these pins; they never select latest releases.
# Ubuntu system packages come from the guest's archive; a baked image pins them.
# Rust and its components are owned by rust-toolchain.toml.

[cargo]
cargo-audit = "0.22.2"
cargo-deny = "0.20.2"
cargo-nextest = "0.9.148"
cargo-mutants = "27.1.0"
cargo-semver-checks = "0.51.0"
just = "1.58.0"
ripgrep = "15.2.0"
rumdl = "0.2.79"
lychee = "0.24.2"
samply = "0.13.1"
gungraun-runner = "0.20.0"
cargo-fuzz = "0.13.2"

[versions]
cargo-rail = "0.32.0"
cargo-binstall = "1.25.3"
llvm = "23.1.3"
cmake = "4.4.4"
wasmtime = "49.0.3"
git = "2.56.0.windows.2"
jq = "1.8.2"
powershell = "7.6.7"
uv = "0.13.4"
rustup = "1.29.1"
zig = "0.17.0"
nasm = "3.02"
strawberry-perl = "5.42.3.1"

[linux]
ubuntu = "26.04"
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "pkgconf", "unzip", "xz-utils", "zstd", "ninja-build", "libssl-dev", "perl", "m4", "shellcheck"]

[ci]
cargo = ["just", "cargo-nextest"]

[ci-cross-build]
cargo = ["just", "cargo-nextest"]
assets = ["just", "cargo-nextest"]
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "cmake", "clang", "libclang-dev", "perl"]

[ci-cross-run]
cargo = []
packages = ["ca-certificates", "curl", "git", "procps"]
perf-package = "linux-tools-generic"
perf-source = { "version" = "5.10.113", "url" = "https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.113.tar.xz", "sha256" = "82516a02bb52456f6e8057217dde6e02b78003b1e058117557c2ae9661696dfc", "packages" = ["bison", "build-essential", "flex", "libdw-dev", "libelf-dev", "patch", "pkgconf", "xz-utils", "zlib1g-dev"] }

[ci-compat]
cargo = ["just", "cargo-nextest"]
assets = ["wasmtime"]
packages = ["build-essential", "ca-certificates", "curl", "git"]
workers = 8

[ci-package]
cargo = ["just", "cargo-semver-checks"]

[ci-fuzz]
cargo = ["just", "cargo-fuzz"]
components = ["rust-src", "llvm-tools"]
packages = ["build-essential", "ca-certificates", "curl", "git", "clang"]

[ci-miri]
cargo = ["just"]
components = ["miri", "rust-src"]
packages = ["build-essential", "ca-certificates", "curl", "git", "clang", "libclang-dev"]

[ci-ct]
cargo = ["just", "cargo-nextest"]
components = ["llvm-tools"]
packages = ["build-essential", "ca-certificates", "curl", "git", "clang", "libclang-dev"]

[ci-ct-proof]
opam-repository = "git+https://github.com/ocaml/opam-repository.git#40d8ad2a8bbef64bd1b88f2d61427310538bfcec"
compiler = "ocaml-base-compiler.5.4.1"
opam = ["binsec.0.11.1", "bitwuzla.1.0.6", "unisim_archisec.0.0.14"]
packages = ["opam", "pkg-config", "libgmp-dev", "autoconf", "bison", "flex", "m4", "unzip", "bubblewrap"]

[ci-bench]
cargo = ["just"]
components = []

[ci-musl]
packages = ["musl-tools"]

[ci-policy]
cargo = ["cargo-deny", "cargo-audit"]

[linux-ci]
ubuntu = "24.04"
packages = ["build-essential", "ca-certificates", "curl", "git", "jq", "cmake", "clang", "libclang-dev", "perl"]

