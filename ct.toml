kind = "select_branch"
slice_sha256 = "b437fa6ead743bf603a06d223fc916b22b53d690e4b9c3ee1d4f1005561e4641"
source = "src/auth/p256_portable.rs:243 bit_mask; :308 signed_radix_32; :311-315 fixed window/bit positions"
classification = "public"
rationale = "a0=0 at +0x530, a1=0 at +0x534; no call or write to these registers before the loop. a4=50 at +0x7c6 and a6=52 at +0x7cc. Each loop increments a1 by one (+0x892), a0 by five (+0x89c), and tests a1!=52 (+0x89e). bltu a4,a1 therefore distinguishes the final public window (index 51) from indices 0..50. The taken arm supplies zero for bits beyond the 256-bit scalar; it does not test the loaded scalar bit a7."
reviewer = "rscrypto selection-hardening review"
reviewed_at = "2026-10-15"

