# Composite ML-DSA adds only public framing around its component owners, so
# it inherits their claims: ML-DSA whole signing has variable retries.
[[primitive]]
id = "signature.composite_mldsa"
tier = "A"
claim = "best-effort"
features = ["mldsa65-ed25519", "mldsa65-ecdsa-p256"]
variants = ["id-MLDSA65-Ed25519-SHA512", "id-MLDSA65-ECDSA-P256-SHA512"]
entrypoints = ["MlDsa65Ed25519::generate_keypair", "MlDsa65EcdsaP256::generate_keypair", "MlDsa65*SecretKey::{from_bytes,from_pkcs8_der,sign_deterministic,sign_with,sign_prehash_*}", "MlDsa65*PreparedSecretKey::sign_*"]
secrets = ["ml_dsa_seed", "expanded_secret_key", "traditional_secret_key", "signing_randomness"]
public = ["algorithm", "public_key", "message_representative", "message_length", "context_length", "accepted_signature"]
may_leak = ["signing_retry_count", "opaque_success_or_failure"]
must_not_leak_ref = "common_secret_data"
required = []
notes = "The composite builds the message representative from public data and calls the ML-DSA-65, Ed25519, and ECDSA P-256 signing operations; their own primitives carry their claims and evidence. Standard ML-DSA signing has variable retries, so no whole-signing timing claim is made. The DudeCT cases hold the ML-DSA seed, randomness, and message fixed and vary only the traditional secret."
[primitive.harness]
status = "partial"
symbols = []
gap = "DudeCT covers composite signing with a fixed ML-DSA key and a fixed or random traditional secret. No linked-root closure, BINSEC kernel, or key-generation and import timing case covers the composite entry points; the component roots cover the arithmetic."

