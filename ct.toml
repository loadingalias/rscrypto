]
must_not_leak_ref = "common_secret_data"
required = ["tier_a"]
notes = "Top-level OS randomness or caller entropy callbacks and public profile parsing may fail publicly. Candidate rejection uses only fresh entropy and the public modulus and is bounded before the shared private-operation leaf. Blinding inversion runs a public divstep count from Bernstein and Yang's bound in batches of 62 masked divsteps with fixed-width limb updates; RISC-V and s390x keep the public-width batched extended-binary-GCD schedule, whose secret-fed co-reduction products are multiplication-free and remain subject to the native timing gate. Validated CRT exponents and the CRT coefficient are retained at the corresponding factor width before steady-state private arithmetic; the stored private exponent is retained at the public modulus width. Steady-state private math and same-width padding/failure behavior are CT-critical. RSAES-PKCS1-v1_5 decryption uses draft-irtf-cfrg-rsa-guidance-10 implicit rejection: a padding failure returns a synthetic message derived with HMAC-SHA256 from the private exponent and the ciphertext, and the derivation, length selection, and output selection run the same work for every reduced ciphertext."
[primitive.harness]
status = "covered"
symbols = [
  "ct_entry_rsa_pkcs1v15_sign_fixed_blinding",
  "ct_entry_rsa_pss_sign_fixed_blinding",
  "ct_entry_rsa_oaep_decrypt_fixed_blinding",
  "ct_entry_rsa_pkcs1v15_decrypt_fixed_blinding",
]
coverage = "Steady-state sign and decrypt roots borrow a key that ct_entry_rsa_fixture_key_import prepared and create their private scratch per call. Key import, validation, and release run outside the enforced roots."

