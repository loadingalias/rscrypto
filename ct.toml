may_leak = ["message_length", "signature"]
must_not_leak_ref = "common_secret_data"
required = ["tier_a"]
notes = "Release CT evidence covers the default and blinded signing APIs. Default signing takes no caller blinding, so its fixed-base multiplication and scalar-order arithmetic run unmasked on the deterministic nonce. Deterministic signing uses fixed-work HMAC-derived wide nonce reduction instead of RFC6979's secret-dependent rejection loop, while P-256 portable blinded signing adds a random multiple of the group order and blinds the projective accumulator before fixed-base multiplication, reblinds before affine conversion, and masks the private-scalar product. On s390x, a fixed-work algebraic fold reduces the wide nonce, fixed-iteration divsteps invert scalar-order values, and two independent caller-random scalars mask projective and order arithmetic. Secret-fed limb products use the top-bit-normalized hardware multiplier on riscv64, as riscv64 ECDH does (owner decision, 2026-10-21); riscv32 and s390x keep the fixed-work multiplier, because secret MLGR products failed native DudeCT on s390x (Constant-Time 39717348652). Native timing evidence qualifies each target."
[primitive.harness]
status = "covered"
symbols = ["ct_entry_ecdsa_p256_sign", "ct_entry_ecdsa_p256_default_sign"]

