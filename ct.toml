rationale = "Diagonal pass. square_wide_portable(out, value): 168(r15) holds out.len (stg r3,168(r15) at +0xa, its only store, entry r3) and 176(r15) holds value.len (stg r5,176(r15) at +0x22, its only store, entry r5). srlg r3,r1,1 at +0x4ea halves out.len (lg r1,168(r15) at +0x4e4), and clg r3,176(r15) at +0x4f0 with jl at +0x4f6 selects min(out.len/2, value.len) as the chunk-zip length (lg r3,176(r15) at +0x4fa otherwise). Only public lengths feed it. The diagonal sums use mlgr and 128-bit vaq without branches; the unrolled loop count and remainder (risbgz at +0x51a and +0x506) derive from this public length."
