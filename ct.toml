[[asm_waiver]]
target = "riscv64gc-unknown-linux-gnu"
primitive = "kx.p256_ecdh"
symbol = "ct_entry_p256_ecdh_agree"
kind = "select_branch"
slice_sha256 = "b437fa6ead743bf603a06d223fc916b22b53d690e4b9c3ee1d4f1005561e4641"
source = "src/auth/p256_portable.rs bit_mask; signed_radix_32; signed_radix_32 fixed window/bit positions"
classification = "public"
rationale = "Final-window test of signed_radix_32, now inlined into the harness entry. a0=0 at +0x1130 and a1=0 at +0x1134. a4=50 at +0x12b0 and a6=52 at +0x12b6. Each loop increments a1 by one (+0x137c) and a0 by five (+0x1386), and tests a1!=52 (+0x1388). bltu a4,a1 at +0x12d0 therefore distinguishes the final public window (index 51) from indices 0..50. The taken arm supplies zero for bits beyond the 256-bit scalar; it does not test the loaded scalar bit a7. The slice is closed."
reviewer = "rscrypto CT waiver renewal review"
reviewed_at = "2026-11-21"

