  "unit:rsa.private_ops.oaep_decrypt",
  "unit:rsa.private_ops.pkcs1v15_decrypt",
]
limitation = "Caller-supplied entropy APIs feed the same private-operation leaf as OS-backed APIs; callback execution and bounded public-modulus blinding-candidate rejection are outside the leaf CT claim. Retained CRT exponents are normalized to the corresponding factor width before arithmetic, so canonical exponent encoding length is not a steady-state control or address input. AArch64 private exponentiation scopes FEAT_DIT when runtime or compile-time detection advertises it. Full private operations remain target-artifact/DudeCT evidence, not source-only claims. RsaSigningWorkspace signing reuses one blinding pair for up to 32 signatures and squares it with the private modular multiplication between refreshes, so factors within an epoch are correlated by design; its native timing is the diagnostic rsa_pkcs1v15_cached_blinding_fixed_vs_random_message case, which no evidence unit relies on yet. The workspace takes the PSS salt and each blinding refresh from separate caller callbacks; a workspace of another key is refused before either callback runs."

