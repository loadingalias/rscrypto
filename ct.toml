# Functions whose select-shaped branches test only public inputs. The scanner accepts a branch in the named
# function only when `leaves` names every value that its condition slice starts from, other than immediates,
# read-only data, and frame addresses. A function input, other memory, or any other call blocks the branch.
[[asm_public_input]]
target = "x86_64-unknown-linux-gnu"
symbol = "rscrypto::platform::detect::detect_uncached"
leaves = ["cpuid", "xgetbv", "call core::core_arch::x86::xsave::_xgetbv", "syscall 158"]
source = "src/platform/detect/arch/x86.rs"
rationale = "Detection runs once per process, takes only its result pointer, and reads no secret. Its conditions test CPUID leaves, XCR0 from XGETBV (core's `_xgetbv`, inlined or called), and the AMX permission word that system call 158, arch_prctl(ARCH_GET_XCOMP_PERM), writes. These values describe the processor and the kernel state of the process."

[[asm_public_input]]
target = "x86_64-pc-windows-msvc"
symbol = "rscrypto::platform::detect::detect_uncached"
leaves = ["cpuid", "xgetbv", "call core::core_arch::x86::xsave::_xgetbv"]
source = "src/platform/detect/arch/x86.rs"
rationale = "Detection runs once per process, takes only its result pointer, and reads no secret. Its conditions test CPUID leaves and XCR0 from XGETBV (core's `_xgetbv`, inlined or called). These values describe the processor and the extended state that the operating system enables."

[[asm_public_input]]
target = "riscv64gc-unknown-linux-gnu"
symbol = "rscrypto::platform::detect::detect_uncached"
leaves = ["syscall 258"]
source = "src/platform/detect/arch/riscv.rs"
rationale = "Detection runs once per process, takes only its result pointer, and reads no secret. Its conditions test the result of system call 258, riscv_hwprobe, and the BASE_BEHAVIOR and IMA_EXT_0 values that it writes. These values describe the hardware."

[[asm_public_input]]
target = "s390x-unknown-linux-gnu"
symbol = "rscrypto::platform::detect::detect_uncached"
leaves = ["stfle", "call getauxval@plt"]
source = "src/platform/detect/arch/s390x.rs"
rationale = "Detection runs once per process, takes only its result pointer, and reads no secret. Its conditions test the AT_HWCAP and AT_HWCAP2 entries that getauxval returns and the facility list that STFLE stores. These values describe the processor and the kernel."

# Select-shaped branches block the gate for these primitives. Reviewed public
# sites require exact asm_waiver identities; count-only rules cannot exempt them.
# Other primitives retain needs-binsec findings pending complete classification.
[asm_select_branch]
enforced_primitives = ["kx.p256_ecdh", "rsa.private_ops", "rsa.private_key_material"]
# RSA key import, validation, release, and DER export run only in setup and
# diagnostic roots. The linked closure of the enforced roots must not reach
# these symbols, and each one must exist in the linked binary, so the check
# cannot pass because a symbol was renamed or inlined away.
unreachable_symbols = [
  "ct_entry_rsa_fixture_key_import",
  "ct_entry_rsa_fixture_key_release",
  "ct_entry_rsa_private_key_pkcs8_roundtrip",
  "<rscrypto::auth::rsa::RsaPrivateKey>::from_pkcs8_der_with_policy",
  "rscrypto::auth::rsa::parse_pkcs1_private_key_der_parts_with_policy",
  "rscrypto::auth::rsa::validate_private_key_components_through_stage",
  "rscrypto::auth::rsa::private_import_is_probable_prime",
  "core::ptr::drop_glue::<rscrypto::auth::rsa::RsaPrivateKey>",
]

