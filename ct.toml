evidence = ["primitive:rng.chacha20", "unit:rng.chacha20.chacha20_rng"]
limitation = "The rand_core trait methods call the inherent methods; from_rng and try_from_rng write the seed straight into the generator key, as try_generate_with does. seed_from_u64 always panics before touching state. Seeding computes the branch key with one portable ChaCha20 block. child computes the child seed with one portable block under the branch key, then seeds through from_seed. No DudeCT case or harness entry calls child directly. DudeCT covers seeding, two refills, and drop. The linked-image harness entry ct_entry_chacha20_rng_fill runs construction, fill, and drop through the dispatched kernel; the BINSEC leaf runs the same state machine over the portable kernel, because symbolic execution does not model runtime dispatch. The accelerated kernels are covered by the AEAD evidence. Rust moves copy the generator state; only its final location clears on drop. Seeding also records the public process origin (platform::ProcessOrigin::current); its first call in a process maps and advises one page on Linux, registers one fork handler on Apple, or reads the process ID. child copies the parent's origin and calls nothing."

