notes = "Top-level OS randomness or caller entropy callbacks and public profile parsing may fail publicly. Candidate rejection uses only fresh entropy and the public modulus and is bounded before the shared private-operation leaf. Blinding inversion multiplies the factor by a fresh inverse mask, inverts the product, and multiplies the result by the mask, so the inverse never reads the factor itself. The inverse runs a public divstep count from Bernstein and Yang's bound in batches of 62 masked divsteps with fixed-width limb updates; RISC-V and s390x keep the public-width batched extended-binary-GCD schedule, whose secret-fed co-reduction products are multiplication-free and remain subject to the native timing gate. Validated CRT exponents and the CRT coefficient are retained at the corresponding factor width before steady-state private arithmetic; the stored private exponent is retained at the public modulus width. Steady-state private math and same-width padding/failure behavior are CT-critical. RSAES-PKCS1-v1_5 decryption uses draft-irtf-cfrg-rsa-guidance-10 implicit rejection: a padding failure returns a synthetic message derived with HMAC-SHA256 from the private exponent and the ciphertext, and the derivation, length selection, and output selection run the same work for every reduced ciphertext. RsaBlindingCache signing keeps the blinding power and inverse in caller-owned state: a refresh runs the uncached candidate draw, masked inverse, and public r^e, and every other signature squares both values with the private modular multiplication. The public use count, key binding, and process ID select between the two."
