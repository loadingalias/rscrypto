  "rscrypto::{SlhDsa,HashSlhDsa}*::{generate_keypair,try_generate_keypair,SIGNATURE_LENGTH}",
  "rscrypto::{SlhDsa,HashSlhDsa}*SecretKey::{sign_deterministic,sign_with,try_sign,public_key,expose_secret,try_from_slice,from_pkcs8_der,to_pkcs8_der_into}",
  "rscrypto::HashSlhDsa*SecretKey::{sign_prehash_deterministic,sign_prehash_with}",
  "rscrypto::{SlhDsa,HashSlhDsa}*PublicKey::{verify,verify_with_context,as_bytes,to_bytes,from_bytes,try_from_slice,from_spki_der,to_spki_der}",
  "rscrypto::HashSlhDsa*PublicKey::verify_prehash",
  "rscrypto::{SlhDsa,HashSlhDsa}*::{Debug,Clone,Default,PartialEq,AsRef,Verifier}",
  "rscrypto::SlhDsa{Error,KeyError}",
]
features = ["slh-dsa", "getrandom"]
targets = ["all-supported", "portable implementation"]
secret_inputs = ["SK.seed", "SK.prf", "PKCS #8 private-key contents", "signing randomness", "WOTS+ chain values and FORS leaf secrets"]
public_inputs = ["parameter set and profile", "message and context lengths", "public key", "signature", "PKCS #8 container structure"]
variable_time_components = ["message and context hashing length", "public parsing and verification", "public PKCS #8 structure parsing"]
permitted_leakage = ["public shapes", "opaque success or failure", "caller-authorized secret exposure"]
claim = "best-effort"
evidence = ["primitive:signature.slhdsa"]
limitation = "Registration only. Key generation, signing, and secret-key import have no CT harness, DudeCT case, or binary review; target qualification is open. Secret-key import regenerates the public root, so its cost equals key generation."

