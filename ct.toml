notes = "Release CT evidence covers the blinded signing APIs. Deterministic signing uses fixed-work HMAC-derived wide nonce reduction instead of RFC6979's secret-dependent rejection loop, while P-256 portable blinded signing adds a random multiple of the group order and blinds the projective accumulator before fixed-base multiplication, reblinds before affine conversion, and masks the private-scalar product. On s390x, a fixed-work algebraic fold reduces the wide nonce, fixed-iteration divsteps invert scalar-order values, and two independent caller-random scalars mask projective and order arithmetic around scalar-multiply-free kernels. RISC-V secret-fed limb products remain scalar-multiply-free and subject to the native timing gate."
[primitive.harness]
status = "covered"
symbols = ["ct_entry_ecdsa_p256_sign"]

