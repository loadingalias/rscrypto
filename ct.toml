# One straight-line path of 8,639 instructions (BINSEC 0.11.1 at `c33bd426`); the default depth cuts it at 1,000.
sse_depth = 20000
secrets = [
  { name = "CT_BINSEC_RSA_PAIR_A", kind = "global", bytes = 384 },
  { name = "CT_BINSEC_RSA_PAIR_B", kind = "global", bytes = 384 },
  { name = "CT_BINSEC_RSA_PAIR_MODULI", kind = "global", bytes = 384 },
  { name = "CT_BINSEC_RSA_PAIR_CONSTANTS", kind = "global", bytes = 32 },
]
public = [
  { name = "RSA_PAIR_DIGITS", kind = "const", value = 24 },
  { name = "RSA_PAIR_BLOCKS", kind = "const", value = 3 },
]
assumptions = []
notes = "Validates both generated paired NEON Montgomery kernels (one multiplication, then one square) at the smallest shape; production RSA private operations on Apple AArch64 without portable-only run the same kernel text at 40, 56, or 80 digits, whose loop counts and addresses depend only on the public digit count. The operands, both CRT moduli, and their Montgomery constants are secret."
claim = "ct-intended"

