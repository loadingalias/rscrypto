source = "src/platform/detect/arch/x86.rs close_x86_implications"
classification = "public"
rationale = "Implication filter (x86.rs:651). r8 is the complement of the decoded capability word (+0x5a3..+0x5a6). rdi is the 1920-byte read-only IMPLIED table (x86.rs:602), bound by contents (+0x59c). rax runs from 0 (+0x59a) in steps of 0x80 (+0x5b0) and stops at 0x780 (+0x5b4). So 0x60(%rax,%rdi) at +0x5da reads only that table, and je +0x5df keeps the feature when all its implied capabilities are present. The stack stores and entry registers in the slice reach this load only through aliasing that the bounded address excludes. The capability word comes only from CPUID results, XCR0, and the permission byte. The open leaves are the _xgetbv and syscall results and frame bytes. _xgetbv (+0x161) sets ecx to 0, executes xgetbv, receives no pointer, and writes no memory. The ARCH_GET_XCOMP_PERM syscall (+0x181) writes only the 8-byte permission word at rsp+0x38. detect_uncached takes only its result pointer, rdi, which +0xe saves and only the final store at +0x643 uses. No condition reads it. The asm_public_input rule cannot accept this branch: only range analysis of the loop counter can show that the indexed IMPLIED load reads only the table, and the scanner has none."
reviewer = "rscrypto exact-artifact condition review"
reviewed_at = "2026-11-12"

