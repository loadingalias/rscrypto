[manifest]
schema_version = 1
policy = "docs/constant-time.md"
owner = "rscrypto"
backend_scope = ["llvm"]
default_claim = "not-claimed"
release_report = "ct-report.json"
harness = "tools/ct-harness"
artifact_script = "scripts/ct/artifacts.sh"

# Sequential DudeCT decision. A required case whose screening |t| reaches
# review_fraction of its threshold is measured again on the same prepared binary
# with sample_factor times its samples, and that measurement decides the case.
[dudect_confirmation]
sample_factor = 4
review_fraction = 0.75
rationale = "With stable distributions and independent samples, a fixed class difference grows expected |t| by about sqrt(sample_factor). Four times the samples keeps every threshold and also escalates passing results within 25% of the threshold. Confirmation uses a new process on the same host; persistent host or measurement bias can survive it, so it does not establish the cause of a timing difference."

[equality_evidence.release_binary]
name = "rscrypto-ct-evidence"
kind = "executable"
profile = "release"
backend = "llvm"
features = ["std", "full", "parallel", "diag", "getrandom"]
default_features = false
owner_widths = [16, 28, 32, 48, 64, 1632, 2400, 3168]
owner_symbols = [
  "ct_entry_owner_eq_16",
  "ct_entry_owner_eq_28",
  "ct_entry_owner_eq_32",
  "ct_entry_owner_eq_48",
  "ct_entry_owner_eq_64",
  "ct_entry_owner_eq_1632",
  "ct_entry_owner_eq_2400",
  "ct_entry_owner_eq_3168",
]
public_len_symbols = [
  "ct_entry_kmac256_verify",
  "ct_entry_mlkem512_decapsulate",
  "ct_entry_mlkem768_decapsulate",
  "ct_entry_mlkem1024_decapsulate",
  "ct_entry_argon2i_verify",
  "ct_entry_argon2d_verify",
  "ct_entry_argon2id_verify",
  "ct_entry_scrypt_verify",
  "ct_entry_rsa_pkcs1v15_sign_fixed_blinding",
  "ct_entry_rsa_pss_sign_fixed_blinding",
  "ct_entry_rsa_oaep_decrypt_fixed_blinding",
  "ct_entry_rsa_pkcs1v15_decrypt_fixed_blinding",
]
formal_owner_widths = [16, 32, 48, 64]
formal_limitation = "BINSEC owner kernels cover the representative 16-, 32-, 48-, and 64-byte production monomorphizations. The 28- and ML-KEM-sized owner monomorphizations require linked-binary disassembly/closure and heuristics on every release lane; BINSEC proof kernels are deferred because they add no caller-selectable shape and the large copies exceed the present proof budget."
downstream_limitation = "Evidence binds this final linked harness executable and its exact compiler/linker configuration. It does not claim constant-time behavior for arbitrary downstream binaries that rebuild or inline rscrypto differently. Production owner comparisons return an opaque CtDecision and the evidence ABI declassifies only at its retained entrypoints."

[[asm_public_operand]]
primitives = ["password.argon2i"]
roots = ["ct_entry_argon2i_verify"]
symbol = "rscrypto::auth::argon2::argon2_hash_with_kernel_inner"
kind = "variable_latency_division"
max_count = 3
source = "src/auth/argon2/mod.rs:1751"
rationale = "The divisions derive matrix dimensions and iteration bounds from validated public Argon2Params, the caller-visible output length, and the target's public vector length. Password and salt contents do not feed the divisors."

[[asm_public_operand]]
primitives = ["password.argon2i"]
roots = ["ct_entry_argon2i_verify"]
symbol = "rscrypto::auth::argon2::fill_segment_inner"
kind = "variable_latency_division"
max_count = 2
source = "src/auth/argon2/mod.rs:1434"
rationale = "For the Argon2i retained root, address generation and segment positions are data-independent; these divisions use public lane, segment, and matrix dimensions rather than password-derived contents."

[[asm_public_operand]]
primitives = ["mac.kmac256_verify"]
roots = ["ct_entry_kmac256_verify"]
symbol = "<rscrypto::auth::kmac::Kmac256>::verify_tag"
kind = "variable_latency_division"
max_count = 1
source = "src/auth/kmac.rs:149"
rationale = "LLVM's scalable-vector loop partition divides the caller-visible expected-tag length by the target's public vector length. Tag contents do not feed the operands."

[[asm_public_operand]]
primitives = ["rsa.private_ops"]
roots = [
  "ct_entry_rsa_oaep_decrypt_fixed_blinding",
  "ct_entry_rsa_pkcs1v15_decrypt_fixed_blinding",
  "ct_entry_rsa_pkcs1v15_sign_fixed_blinding",
  "ct_entry_rsa_pss_sign_fixed_blinding",
]
symbol = "rscrypto::auth::rsa::mont_mul_cios_portable"
kind = "variable_latency_division"
max_count = 1
source = "src/auth/rsa.rs:10425"
rationale = "LLVM's scalable-vector loop partition divides the public modulus-width iteration count by the target's public vector length. Private limb contents do not feed the operands."

[[asm_public_operand]]
primitives = ["rsa.private_ops"]
roots = [
  "ct_entry_rsa_oaep_decrypt_fixed_blinding",
  "ct_entry_rsa_pkcs1v15_decrypt_fixed_blinding",
  "ct_entry_rsa_pkcs1v15_sign_fixed_blinding",
  "ct_entry_rsa_pss_sign_fixed_blinding",
]
symbol = "rscrypto::auth::rsa::mont_reduce_cios"
kind = "variable_latency_division"
max_count = 1
source = "src/auth/rsa.rs:10475"
rationale = "LLVM's scalable-vector loop partition divides the public modulus-width iteration count by the target's public vector length. Private limb contents do not feed the operands."

[[asm_public_operand]]
primitives = ["rsa.private_ops"]
roots = [
  "ct_entry_rsa_oaep_decrypt_fixed_blinding",
  "ct_entry_rsa_pkcs1v15_decrypt_fixed_blinding",
  "ct_entry_rsa_pkcs1v15_sign_fixed_blinding",
  "ct_entry_rsa_pss_sign_fixed_blinding",
]
symbol = "rscrypto::auth::rsa::public_montgomery_r2_into"
kind = "variable_latency_division"
max_count = 1
source = "src/auth/rsa.rs:10040"
rationale = "LLVM's scalable-vector loop partition divides the public modulus limb width by the target's public vector length. No private value feeds the operands."

# Select-shaped branches block the gate for these primitives. Reviewed public
# sites require exact asm_waiver identities; count-only rules cannot exempt them.
# Other primitives retain needs-binsec findings pending complete classification.
[asm_select_branch]
enforced_primitives = ["kx.p256_ecdh", "rsa.private_ops", "rsa.private_key_material"]
# RSA key import, validation, release, and DER export run only in setup and
# diagnostic roots. The linked closure of the enforced roots must not reach
# these symbols, and each one must exist in the linked binary, so the check
# cannot pass because a symbol was renamed or inlined away.
unreachable_symbols = [
  "ct_entry_rsa_fixture_key_import",
  "ct_entry_rsa_fixture_key_release",
  "ct_entry_rsa_private_key_pkcs8_roundtrip",
  "<rscrypto::auth::rsa::RsaPrivateKey>::from_pkcs8_der_with_policy",
  "rscrypto::auth::rsa::parse_pkcs1_private_key_der_parts_with_policy",
  "rscrypto::auth::rsa::validate_private_key_components_through_stage",
  "rscrypto::auth::rsa::private_import_is_probable_prime",
  "core::ptr::drop_glue::<rscrypto::auth::rsa::RsaPrivateKey>",
]

[operation_inventory]
schema_version = 1
authority = "ct.toml"
scope = ["production", "feature-gated", "target-gated", "trait-defaults", "escape-hatches"]
completeness = "Every security primitive must be referenced by at least one checked public-operation family; every family must carry evidence or an explicit limitation; the all-features compiler API snapshot prevents unaudited public-surface drift."
compiler_api_prefixes = [
  "rscrypto::aead",
  "rscrypto::auth",
  "rscrypto::backend",
  "rscrypto::hashes::crypto",
  "rscrypto::hex",
  "rscrypto::rng",
  "rscrypto::secret",
  "rscrypto::traits",
]

