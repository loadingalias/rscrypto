source = "src/auth/p256_portable.rs bit_mask; src/auth/p256_portable.rs scalar_mul_generator_portable; src/auth/p256_portable.rs digit bit index; src/auth/p256_portable.rs scalar_mul_generator_portable low/middle/high rows"
classification = "public"
rationale = "Public comb row bound, now inlined into the harness entry. The countdown r10 starts at 12 (+0x21c), and the loop exits when it reaches 0 (+0x2da). stg r10,624(%r15) at +0x2e0 is the only store to that slot. lg r12,624(%r15) (+0xe30) and lay r10,-1(r12) (+0xe36) form the next count. lg r9,624(%r15) at +0xec0 loads the current count, and no instruction writes r9 before the branch; calls preserve it. So r9 is 12..1. The calls receive objects that end at sp+623 or start at sp+672, so none reaches sp+624. clgijl r9,10 at +0x122e keeps the high scalar limb loaded from sp+1072 (+0x1228) when the last high-comb bit is below 256, and the fallthrough sets r2=0 (+0x1234). This is a public bit-index bound, not a comparison of secret limb contents."
reviewer = "rscrypto CT waiver renewal review"
reviewed_at = "2026-11-21"

