rationale = "Public countdown r10 starts 12 at +0xce, is stored in [sp+608] at +0x192, and copied to r9 at +0xd72. At +0xce2 the saved countdown is loaded into r12 and +0xce8 computes next r10=r12-1; the fixed loop exits when r10==0 at +0x18c. No intervening write to r9 follows +0xd72 before this branch; ABI calls preserve it. Therefore r9 is 12..1 and source row=r9-1. The last high-comb bit is row+25+6*37=r9+246. clgijl r9,10 skips zero replacement exactly when that bit is below 256. The fallthrough sets r2=0; otherwise r2 retains the high scalar limb loaded from [sp+992] at +0x10da. The later shift by r9+54 at +0x1174 extracts the corresponding in-range limb bit. This is a public bit-index bound, not a comparison of secret limb contents."
reviewer = "rscrypto selection-hardening review"
reviewed_at = "2026-10-18"

