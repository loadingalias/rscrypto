[package]
name = "rscrypto-residue-harness"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = false

[profile.dev]
panic = "abort"

[dependencies]
rscrypto = { path = "../..", default-features = false, features = ["alloc", "hkdf", "ml-dsa", "ml-kem", "slh-dsa"] }
sha2 = { version = "=0.11.1", default-features = false }

[features]
portable-only = ["rscrypto/portable-only"]
native-mldsa = ["rscrypto/std"]
capture-mldsa = ["native-mldsa"]

[[bin]]
name = "rscrypto-residue-harness"
path = "src/main.rs"
bench = false
test = false

[[bin]]
name = "rscrypto-mldsa-residue-native"
path = "src/mldsa_native.rs"
required-features = ["native-mldsa"]
bench = false
test = false
