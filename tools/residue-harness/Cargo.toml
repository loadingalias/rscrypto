[package]
name = "rscrypto-residue-harness"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = false

[profile.dev]
panic = "abort"

[dependencies]
rscrypto = { path = "../..", default-features = false, features = ["alloc", "ml-dsa", "ml-kem"] }

[features]
portable-only = ["rscrypto/portable-only"]

[[bin]]
name = "rscrypto-residue-harness"
path = "src/main.rs"
bench = false
test = false
