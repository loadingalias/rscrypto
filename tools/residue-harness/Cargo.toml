[package]
name = "rscrypto-residue-harness"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rscrypto = { path = "../..", default-features = false, features = ["alloc", "blake3", "hkdf", "ml-dsa", "ml-kem", "mldsa65-ecdsa-p256", "mldsa65-ed25519", "slh-dsa", "x-wing", "hpke", "aes-gcm", "chacha20poly1305"] }
sha2 = { version = "=0.11.1", default-features = false }
# Independent BLAKE3 for the chaining-value needles; `pure` builds no C or assembly.
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }

[features]
portable-only = ["rscrypto/portable-only"]
native-mldsa = ["rscrypto/std"]
capture-mldsa = ["native-mldsa"]
native-slhdsa = ["rscrypto/std"]

[[bin]]
name = "rscrypto-residue-harness"
path = "src/main.rs"
bench = false
test = false

[[bin]]
name = "rscrypto-mldsa-residue-native"
path = "src/mldsa_native.rs"
required-features = ["native-mldsa"]
bench = false
test = false

[[bin]]
name = "rscrypto-slhdsa-residue-native"
path = "src/slhdsa_native.rs"
required-features = ["native-slhdsa"]
bench = false
test = false
