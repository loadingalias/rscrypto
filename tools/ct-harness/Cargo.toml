[package]
name = "rscrypto-ct-harness"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "rscrypto_ct_harness"
crate-type = ["rlib", "staticlib"]
bench = false

[[bin]]
name = "rscrypto-ct-evidence"
path = "src/main.rs"
bench = false

[dependencies]
rscrypto = { path = "../..", default-features = false, features = [
  "std",
  "full",
  "parallel",
  "diag",
  "getrandom",
] }
