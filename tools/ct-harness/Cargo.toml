[package]
name = "rscrypto-ct-harness"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "rscrypto_ct_harness"
path = "../../src/ct_tests/operations.rs"
crate-type = ["rlib", "staticlib"]
bench = false

[dependencies]
rscrypto = { path = "../..", default-features = false, features = [
  "std",
  "full",
  "parallel",
  "getrandom",
] }
