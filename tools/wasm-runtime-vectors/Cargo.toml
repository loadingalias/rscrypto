rust-version = "1.100.0"
publish = false

[workspace]

[dependencies]
rscrypto = { path = "../..", default-features = false, features = ["alloc", "argon2", "hashes", "aes-gcm", "aes-siv", "chacha20poly1305", "ecdsa", "p256-ecdh", "p384-ecdh", "ml-dsa", "rsa", "slh-dsa", "websocket-sha1"] }
