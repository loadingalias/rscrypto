[package]
name = "rscrypto-wasm-runtime-vectors"
version = "0.0.0"
edition = "2024"
rust-version = "1.91.0"
publish = false

[workspace]

[dependencies]
rscrypto = { path = "../..", default-features = false, features = ["alloc", "hashes", "aes-gcm", "aes-siv", "chacha20poly1305", "ecdsa", "rsa", "websocket-sha1"] }
