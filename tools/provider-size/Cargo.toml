[package]
name = "rscrypto-provider-size"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "Apache-2.0"

[workspace]

[features]
# Link `default_provider()` and OS entropy instead of `ClientProvider` over caller entropy.
default-provider = ["rscrypto-rustls/getrandom"]

[dependencies]
# The provider features that top-secret reaches; `getrandom` stays off.
rscrypto-rustls = { path = "../../rscrypto-rustls", default-features = false, features = [
  "sha2",
  "hmac",
  "hkdf",
  "aes-gcm",
  "chacha20poly1305",
  "x25519",
  "p256-ecdh",
  "p384-ecdh",
  "ml-kem",
  "ecdsa-p256",
  "ecdsa-p384",
  "ed25519",
  "rsa",
] }
rustls = { version = "=0.24.0-dev.2", git = "https://github.com/rustls/rustls", rev = "0419f479ff5c99a471428ee197e899ccd1629aa8", default-features = false, features = ["webpki"] }

# The release profile of top-secret.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
