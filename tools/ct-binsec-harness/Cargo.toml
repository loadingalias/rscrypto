[package]
name = "rscrypto-ct-binsec-harness"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rscrypto = { path = "../..", default-features = false, features = [
  "aead",
  "argon2",
  "blake2b",
  "blake2s",
  "blake3",
  "chacha20-rng",
  "std",
  "ecdsa",
  "ed25519",
  "hkdf",
  "hmac",
  "kmac",
  "ml-dsa",
  "p256-ecdh",
  "p384-ecdh",
  "pbkdf2",
  "portable-only",
  "rsa",
  "x25519",
] }

[[bin]]
name = "rscrypto-ct-binsec-harness"
path = "src/main.rs"
