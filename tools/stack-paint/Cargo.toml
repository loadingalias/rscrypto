[package]
name = "rscrypto-stack-paint"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

# The provider's shipping release settings, as in tools/frame-review: measured
# frames must come from the same inlining and layout decisions.
[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = false

[dependencies]
rscrypto-rustls = { path = "../../rscrypto-rustls", features = ["ml-dsa"] }
rustls = { version = "=0.24.0-dev.2", git = "https://github.com/rustls/rustls", rev = "0419f479ff5c99a471428ee197e899ccd1629aa8", default-features = false, features = ["webpki"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
portable-only = ["rscrypto-rustls/portable-only"]

[lib]
name = "rscrypto_stack_paint"
path = "src/lib.rs"
bench = false
test = false

[[bin]]
name = "rscrypto-stack-edges"
path = "src/bin/edges.rs"
bench = false
test = false

[[bin]]
name = "rscrypto-stack-worker"
path = "src/bin/worker.rs"
bench = false
test = false
