[package]
name = "rscrypto-stack-paint"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rscrypto-rustls = { path = "../../rscrypto-rustls", features = ["ml-dsa"] }
rustls = { workspace = true, features = ["std", "webpki"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
portable-only = ["rscrypto-rustls/portable-only"]

[lib]
name = "rscrypto_stack_paint"
path = "src/lib.rs"
bench = false
test = false

[[bin]]
name = "rscrypto-stack-edges"
path = "src/bin/edges.rs"
bench = false
test = false

[[bin]]
name = "rscrypto-stack-worker"
path = "src/bin/worker.rs"
bench = false
test = false
