[package]
name = "rscrypto-mldsa-tail"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rscrypto = { path = "../..", default-features = false, features = ["ml-dsa", "std"] }

[[bin]]
name = "rscrypto-mldsa-tail"
path = "src/main.rs"
bench = false
test = false

[features]
portable-only = ["rscrypto/portable-only"]
