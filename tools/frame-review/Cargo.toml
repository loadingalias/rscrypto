[package]
name = "rscrypto-frame-review"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rscrypto = { path = "../..", default-features = false, features = ["aes-gcm", "chacha20poly1305", "hpke", "ml-dsa", "ml-kem", "mldsa65-ecdsa-p256", "mldsa65-ed25519", "slh-dsa", "std", "x-wing"] }

[[bin]]
name = "rscrypto-frame-review"
path = "src/main.rs"
bench = false

[features]
portable-only = ["rscrypto/portable-only"]
