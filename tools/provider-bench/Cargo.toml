[package]
name = "rscrypto-provider-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "MIT OR Apache-2.0"
autobenches = false

[workspace]

[features]
ml-dsa = ["rscrypto-rustls/ml-dsa"]
quinn = ["rscrypto-rustls/quinn", "dep:quinn-proto", "dep:bytes"]
primitives = ["dep:rscrypto"]
portable-only = ["rscrypto-rustls/portable-only"]
# Cross-target lint jobs can compile without a target OpenSSL installation.
# Measurements still require the linked OpenSSL 4.0.3 checked by the fixture.
vendored-openssl = ["openssl/vendored"]

[dependencies]
rscrypto = { path = "../..", default-features = false, features = ["std", "sha2", "sha3", "aes-gcm"], optional = true }
rscrypto-rustls = { path = "../../rscrypto-rustls" }
rustls = { version = "=0.24.0-dev.2", git = "https://github.com/rustls/rustls", rev = "1783110b45f8e8d3cf3307383a3feebd3443735c", default-features = false, features = ["webpki"] }
rustls-aws-lc-rs = { version = "=0.24.0-dev.2", git = "https://github.com/rustls/rustls", rev = "1783110b45f8e8d3cf3307383a3feebd3443735c" }
rustls-ring = { version = "=0.24.0-dev.2", git = "https://github.com/rustls/rustls", rev = "1783110b45f8e8d3cf3307383a3feebd3443735c" }
openssl = "=0.10.81"
libc = "0.2.191"
serde_json = "1.0.154"
quinn-proto = { version = "=0.12.0", git = "https://github.com/quinn-rs/quinn", rev = "2697de1e1314cb9f98502b7323acd5bdd836b582", default-features = false, features = ["bloom"], optional = true }
bytes = { version = "1.12.1", optional = true }

[target.'cfg(all(target_os = "linux", target_env = "gnu", any(target_arch = "s390x", all(target_arch = "powerpc64", target_endian = "little"))))'.dependencies]
# The pinned AWS-LC bindings must be generated for these comparison hosts.
aws-lc-sys = { version = "0.46.0", features = ["bindgen"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["html_reports", "plotters"] }

[[bench]]
name = "tls_connections"
harness = false
required-features = ["ml-dsa"]

[[bench]]
name = "quic_connections"
harness = false
required-features = ["quinn"]

[[bench]]
name = "openssl_primitives"
harness = false
required-features = ["primitives"]

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"
overflow-checks = true
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
strip = "none"
