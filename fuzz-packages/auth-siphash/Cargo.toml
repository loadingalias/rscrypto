[package]
name = "rscrypto-fuzz-auth-siphash"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
siphasher = "1.0.4"
rscrypto = { path = "../..", features = ["std", "siphash"] }
rscrypto_fuzz = { package = "rscrypto-fuzz-support", path = "../../fuzz/support" }

[workspace]
members = ["."]

[[bin]]
name = "auth_siphash"
path = "fuzz_targets/auth_siphash.rs"
doc = false
