[package]
name = "rscrypto-fuzz-checksums-adler32"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
rscrypto = { path = "../..", features = ["std", "adler32"] }
rscrypto_fuzz = { package = "rscrypto-fuzz-support", path = "../../fuzz/support" }
simd-adler32 = "0.3.10"

[workspace]
members = ["."]

[[bin]]
name = "checksum_adler32"
path = "fuzz_targets/checksum_adler32.rs"
doc = false
